<!DOCTYPE html>
<html lang="ru">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>STARK AI AGENT v3.1 — АКТУАЛЬНЫЕ ДАННЫЕ</title>
<style>
  body { font-family: 'Inter', system-ui, sans-serif; background: #0F0F0F; color: #E0E0E0; margin: 0; padding: 20px; }
  .container { max-width: 1100px; margin: auto; }
  h1 { color: #C9A84C; }
  input, button, textarea { padding: 12px; margin: 8px 0; border-radius: 4px; }
  button { background: #C9A84C; color: black; font-weight: bold; cursor: pointer; }
  #result { background: #1A1A1A; padding: 20px; border-radius: 8px; white-space: pre-wrap; margin-top: 20px; }
  .price { color: #4CAF7D; font-weight: bold; }
</style>
</head>
<body>
<div class="container">
  <h1>STARK AI AGENT v3.1</h1>
  <p>Актуальные данные • Скрытые корреляции • Предвосхищение</p>

  <input type="text" id="ticker" placeholder="Тикер (VST, CCJ, NKE...)" style="width:300px;">
  <button onclick="analyzeTicker()">АНАЛИЗИРОВАТЬ</button>
  <button onclick="getPrice()">Текущая Цена</button>

  <div id="result"></div>
</div>

<script>
async function getPrice() {
  const ticker = document.getElementById('ticker').value.trim().toUpperCase();
  if (!ticker) return alert('Введи тикер');
  
  const res = await fetch('/api/analyze', {
    method: 'POST',
    headers: { 'Content-Type': 'application/json' },
    body: JSON.stringify({ action: 'price', ticker })
  });
  const data = await res.json();
  document.getElementById('result').innerHTML = `<strong class="price">${ticker}: $${data.price || '—'}</strong>`;
}

async function analyzeTicker() {
  const ticker = document.getElementById('ticker').value.trim().toUpperCase();
  if (!ticker) return alert('Введи тикер');

  const resultDiv = document.getElementById('result');
  resultDiv.textContent = 'Анализирую актуальные данные...';

  const currentDate = new Date().toISOString().split('T')[0];

  const prompt = `
Сейчас ${currentDate}. Ищи САМЫЕ СВЕЖИЕ данные на сегодня через web_search.

Тикер: ${ticker}

Проведи полный STARK анализ по 8 уровням.
Обязательно используй web_search для:
- Текущей цены и последних движений
- Свежих новостей (последние 7 дней)
- Инсайдеров (SEC Form 4)
- Катализаторов с датами

Верни ТОЛЬКО чистый JSON. Никакого текста до или после.
`;

  try {
    const res = await fetch('/api/analyze', {
      method: 'POST',
      headers: { 'Content-Type': 'application/json' },
      body: JSON.stringify({ 
        action: 'analyze', 
        ticker: ticker,
        prompt: prompt 
      })
    });

    const data = await res.json();
    resultDiv.textContent = data.text || JSON.stringify(data, null, 2);
    
  } catch (e) {
    resultDiv.textContent = 'Ошибка: ' + e.message;
  }
}
</script>
</body>
</html>
