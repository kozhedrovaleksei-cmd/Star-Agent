<!DOCTYPE html>
<html lang="ru">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>⚡️ STARK UNIVERSAL AGGREGATOR v2.0</title>
  <style>
    body {font-family: 'Segoe UI', sans-serif; background:#0a0a0a; color:#00ff9d; margin:0; padding:20px;}
    .container {max-width:1200px; margin:auto;}
    h1 {color:#00ff9d; text-align:center;}
    .controls {display:flex; gap:12px; margin:20px 0; flex-wrap:wrap;}
    input {flex:1; padding:18px; font-size:18px; background:#111; border:2px solid #00ff9d; color:white; border-radius:12px;}
    button {padding:18px 40px; background:#00ff9d; color:#000; font-weight:bold; border:none; border-radius:12px; cursor:pointer;}
    .quick {display:flex; gap:8px; flex-wrap:wrap; margin:15px 0;}
    .quick button {padding:8px 16px; background:#1a1a1a; border:1px solid #00ff9d; color:#00ff9d;}
    .result {background:#111; padding:25px; border-radius:12px; border:1px solid #00ff9d; margin-top:20px; white-space:pre-wrap; max-height:70vh; overflow:auto; display:none;}
  </style>
</head>
<body>
  <div class="container">
    <h1>⚡️ STARK UNIVERSAL AGGREGATOR v2.0</h1>
    <p style="text-align:center; color:#00cc7a;">Скрытые корреляции • Edge раньше рынка</p>

    <div class="quick">
      <button onclick="analyzeQuick('NKE')">NKE</button>
      <button onclick="analyzeQuick('CCJ')">CCJ</button>
      <button onclick="analyzeQuick('JD')">JD</button>
      <button onclick="analyzeQuick('VST')">VST</button>
      <button onclick="analyzeQuick('BTC')">BTC</button>
      <button onclick="analyzeQuick('SBER')">SBER</button>
    </div>

    <div class="controls">
      <input type="text" id="ticker" placeholder="NKE или Bitcoin или Сбер..." />
      <button onclick="startAnalyze()">⚡ АНАЛИЗИРОВАТЬ</button>
    </div>

    <div id="result" class="result"></div>
  </div>

  <script>
    async function startAnalyze() {
      const ticker = document.getElementById('ticker').value.trim();
      if (!ticker) return alert("Введи тикер!");
      analyze(ticker);
    }

    function analyzeQuick(ticker) {
      document.getElementById('ticker').value = ticker;
      analyze(ticker);
    }

    async function analyze(ticker) {
      const resDiv = document.getElementById('result');
      resDiv.style.display = 'block';
      resDiv.innerHTML = `<p style="color:#ffd700">⚡️ STARK анализирует ${ticker}... (15-35 сек)</p>`;

      try {
        const response = await fetch('/api/analyze', {
          method: 'POST',
          headers: {'Content-Type': 'application/json'},
          body: JSON.stringify({ action: 'analyze', ticker: ticker })
        });

        const data = await response.json();
        resDiv.innerHTML = data.text || `<pre>${JSON.stringify(data)}</pre>`;
      } catch (err) {
        resDiv.innerHTML = `<p style="color:#ff4444">Ошибка: ${err.message}<br>Проверь Environment Variables на Vercel.</p>`;
      }
    }
  </script>
</body>
</html>
