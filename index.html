<!DOCTYPE html>
<html lang="ru">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>⚡️ STARK UNIVERSAL AGGREGATOR</title>
  <style>
    body {
      font-family: 'Segoe UI', system-ui, sans-serif;
      background: #0a0a0a;
      color: #00ff9d;
      margin: 0;
      padding: 20px;
      line-height: 1.6;
    }
    .container { max-width: 1200px; margin: 0 auto; }
    header { text-align: center; margin-bottom: 30px; }
    h1 { color: #00ff9d; margin: 0; font-size: 2.4em; }
    .subtitle { color: #00cc7a; font-size: 1.1em; }

    .controls {
      display: flex;
      gap: 12px;
      margin-bottom: 25px;
      flex-wrap: wrap;
      align-items: center;
    }
    input {
      flex: 1;
      min-width: 300px;
      padding: 16px 20px;
      font-size: 18px;
      background: #1a1a1a;
      border: 2px solid #00ff9d;
      color: white;
      border-radius: 10px;
    }
    button {
      padding: 16px 36px;
      background: #00ff9d;
      color: #000;
      font-weight: bold;
      border: none;
      border-radius: 10px;
      cursor: pointer;
      font-size: 17px;
      white-space: nowrap;
    }
    button:hover { background: #00e68a; transform: scale(1.03); }

    .quick-buttons {
      display: flex;
      flex-wrap: wrap;
      gap: 8px;
      margin-bottom: 20px;
    }
    .quick-btn {
      padding: 8px 18px;
      background: #1f1f1f;
      border: 1px solid #00ff9d;
      color: #00ff9d;
      border-radius: 8px;
      cursor: pointer;
      font-size: 14px;
    }
    .quick-btn:hover { background: #00ff9d; color: #000; }

    .result {
      background: #111;
      padding: 30px;
      border-radius: 12px;
      border: 1px solid #00ff9d;
      white-space: pre-wrap;
      font-size: 15.5px;
      max-height: 75vh;
      overflow-y: auto;
      display: none;
    }
    .loading {
      color: #ffd700;
      font-style: italic;
      text-align: center;
      padding: 40px;
    }
    .history {
      margin-top: 30px;
    }
  </style>
</head>
<body>
  <div class="container">
    <header>
      <h1>⚡️ STARK UNIVERSAL AGGREGATOR v2.0</h1>
      <p class="subtitle">Скрытые корреляции • Лаговые зависимости • Edge раньше рынка</p>
    </header>

    <div class="quick-buttons">
      <span class="quick-btn" onclick="quickAnalyze('NKE')">NKE</span>
      <span class="quick-btn" onclick="quickAnalyze('CCJ')">CCJ</span>
      <span class="quick-btn" onclick="quickAnalyze('JD')">JD</span>
      <span class="quick-btn" onclick="quickAnalyze('VST')">VST</span>
      <span class="quick-btn" onclick="quickAnalyze('UEC')">UEC</span>
      <span class="quick-btn" onclick="quickAnalyze('BTC')">BTC</span>
      <span class="quick-btn" onclick="quickAnalyze('SBER')">SBER</span>
      <span class="quick-btn" onclick="quickAnalyze('TSLA')">TSLA</span>
    </div>

    <div class="controls">
      <input type="text" id="tickerInput" placeholder="Введи любой тикер или название (NKE, Bitcoin, Сбер, HYPE...)" />
      <button onclick="startAnalysis()">⚡ АНАЛИЗИРОВАТЬ</button>
    </div>

    <div id="result" class="result"></div>

    <div class="history">
      <h3>История анализов (последние 5)</h3>
      <div id="historyList"></div>
    </div>
  </div>

  <script>
    let history = [];

    async function startAnalysis() {
      const input = document.getElementById('tickerInput').value.trim().toUpperCase();
      if (!input) return alert('Введите тикер или название!');
      analyze(input);
    }

    function quickAnalyze(ticker) {
      document.getElementById('tickerInput').value = ticker;
      analyze(ticker);
    }

    async function analyze(ticker) {
      const resultDiv = document.getElementById('result');
      resultDiv.style.display = 'block';
      resultDiv.innerHTML = `<p class="loading">⚡️ STARK сканирует рынок... Ищем скрытые корреляции для ${ticker} (15–30 сек)</p>`;

      try {
        // Получаем цену
        const priceRes = await fetch('/api/analyze', {
          method: 'POST',
          headers: { 'Content-Type': 'application/json' },
          body: JSON.stringify({ action: 'price', ticker })
        });
        const priceData = await priceRes.json();

        // Главный анализ
        const analyzeRes = await fetch('/api/analyze', {
          method: 'POST',
          headers: { 'Content-Type': 'application/json' },
          body: JSON.stringify({ 
            action: 'analyze', 
            ticker: ticker,
            priceData: priceData 
          })
        });

        const data = await analyzeRes.json();
        
        resultDiv.innerHTML = data.text || `<pre>${JSON.stringify(data, null, 2)}</pre>`;

        // Сохраняем в историю
        history.unshift({ ticker, time: new Date().toLocaleTimeString(), result: data.text?.substring(0, 300) + '...' });
        if (history.length > 5) history.pop();
        updateHistory();
      } catch (e) {
        resultDiv.innerHTML = `<p style="color:#ff4444">Ошибка: ${e.message}<br>Проверь Crazyrouter и Vercel env.</p>`;
      }
    }

    function updateHistory() {
      const list = document.getElementById('historyList');
      list.innerHTML = history.map(item => `
        <div style="background:#1a1a1a; padding:12px; margin:8px 0; border-radius:8px; border-left:3px solid #00ff9d;">
          <strong>${item.ticker}</strong> — ${item.time}
        </div>
      `).join('');
    }
  </script>
</body>
</html>
