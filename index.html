<!DOCTYPE html>
<html lang="ru">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>STARK ULTIMATE v5.1 • I AM IRON MAN</title>
<style>
@import url('https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700&family=Bebas+Neue&display=swap');

:root {
  --gold: #D4AF37;
  --green: #00ff9d;
  --red: #ff3b5c;
  --bg: #0a0a0a;
  --card: #111111;
  --accent: #0071e3;
}

body {
  background: var(--bg);
  color: #e0e0e0;
  font-family: 'Inter', system-ui, sans-serif;
  margin: 0;
  padding: 0;
}

.header {
  background: linear-gradient(135deg, #1a1a00, #0a0a0a);
  padding: 24px 48px;
  display: flex;
  justify-content: space-between;
  align-items: center;
  border-bottom: 5px solid var(--gold);
  position: sticky;
  top: 0;
  z-index: 100;
}

.logo {
  font-family: 'Bebas Neue', sans-serif;
  font-size: 46px;
  letter-spacing: 4px;
  color: var(--gold);
}

.status {
  background: #00ff9d;
  color: black;
  padding: 6px 18px;
  border-radius: 9999px;
  font-size: 14px;
  font-weight: 600;
}

.main {
  max-width: 1480px;
  margin: 40px auto;
  padding: 0 48px;
}

.top {
  display: flex;
  gap: 24px;
  margin-bottom: 32px;
}

.big-card {
  background: var(--card);
  border-radius: 24px;
  padding: 36px;
  flex: 1;
  border: 1px solid #222;
  box-shadow: 0 20px 60px rgba(0,0,0,0.6);
}

.metric {
  font-size: 58px;
  font-weight: 700;
  margin: 8px 0 4px;
}

.grid {
  display: grid;
  grid-template-columns: repeat(auto-fit, minmax(360px, 1fr));
  gap: 24px;
}

.card {
  background: var(--card);
  border-radius: 20px;
  padding: 28px;
  border: 1px solid #222;
}

.section-title {
  color: var(--gold);
  font-size: 21px;
  margin-bottom: 20px;
  padding-bottom: 12px;
  border-bottom: 2px solid var(--gold);
}
</style>
</head>
<body>

<div class="header">
  <div class="logo">STARK ULTIMATE</div>
  <div>
    <span class="status">● ONLINE</span>
    <div style="margin-top:6px; font-size:15px;">Алексей • Iron Man Protocol • 29.05.2026</div>
  </div>
</div>

<div class="main">
  <div class="top">
    <div class="big-card">
      <h2 style="margin:0 0 16px 0; color:var(--gold);">СЕГОДНЯ • 29 МАЯ 2026</h2>
      <div style="display:grid; grid-template-columns: repeat(4, 1fr); gap:24px;">
        <div>
          <div style="font-size:13px; opacity:0.7;">ДЕПОЗИТ</div>
          <div class="metric">450 000 ₽</div>
        </div>
        <div>
          <div style="font-size:13px; opacity:0.7;">БЕЗ АЛКОГОЛЯ</div>
          <div class="metric" style="color:var(--green);">4+ МЕСЯЦА</div>
        </div>
        <div>
          <div style="font-size:13px; opacity:0.7;">STREAK ВИМ ХОФ</div>
          <div class="metric">4 ДНЯ</div>
        </div>
        <div>
          <div style="font-size:13px; opacity:0.7;">КВАЛ ИНВЕСТОР</div>
          <div class="metric" style="color:var(--green);">Q1 ✓</div>
        </div>
      </div>
    </div>

    <div class="big-card">
      <h2 class="section-title">⚡ БЫСТРЫЙ АНАЛИЗ</h2>
      <input type="text" id="tickerInput" placeholder="NKE · Nike · Сбербанк · VST" style="width:100%; padding:18px; background:#1a1a1a; border:2px solid var(--gold); color:white; border-radius:14px; font-size:18px;">
      <button onclick="analyzeAsset()" style="margin-top:16px; width:100%; padding:18px; background:var(--gold); color:black; font-weight:700; border:none; border-radius:14px; font-size:18px;">ЗАПУСТИТЬ АНАЛИЗ</button>
    </div>
  </div>

  <div class="grid" id="result">
    <!-- Дашборд будет заполняться здесь -->
  </div>
</div>

<script>
async function analyzeAsset() {
  let input = document.getElementById('tickerInput').value.trim() || "NKE";
  const resultDiv = document.getElementById('result');
  resultDiv.innerHTML = `<div style="padding:80px; text-align:center; color:var(--gold); font-size:24px;">STARK анализирует ${input}...</div>`;

  try {
    const res = await fetch('/api/analyze', {
      method: 'POST',
      headers: { 'Content-Type': 'application/json' },
      body: JSON.stringify({ action: 'analyze', ticker: input })
    });

    const data = await res.json();
    let raw = data.text.replace(/```json|```/g, '').trim();
    let stock = {};
    try { stock = JSON.parse(raw); } catch(e) { stock.analysis = raw; }

    resultDiv.innerHTML = `
      <div class="big-card">
        <h2 style="color:var(--gold); margin-bottom:12px;">${stock.ticker || input} — ${stock.company || ''}</h2>
        <div style="font-size:68px; font-weight:700;">${stock.price || '—'}</div>
        <div style="font-size:22px; color:${(stock.changePercent || 0) > 0 ? 'var(--green)' : 'var(--red)'};">${stock.change || ''}</div>
      </div>

      <div class="grid">
        <div class="card">
          <h3 class="section-title">🎯 ЦЕЛИ</h3>
          <p>Цель 1 (6-9 мес): <strong style="color:var(--green)">${stock.target1 || '—'}</strong></p>
          <p>Цель 2 (12-15 мес): <strong style="color:var(--green)">${stock.target2 || '—'}</strong></p>
          <p>Цель 3 (18-24 мес): <strong style="color:var(--green)">${stock.target3 || '—'}</strong></p>
        </div>

        <div class="card">
          <h3 class="section-title">🔮 ПРЕДВОСХИЩЕНИЕ</h3>
          <p><strong>${stock.anticipationNarrative || 'Анализ в процессе...'}</strong></p>
        </div>

        <div class="card">
          <h3 class="section-title">📊 МЕТРИКИ</h3>
          <p>МКТ Кап: ${stock.marketCap || '—'}</p>
          <p>P/E: ${stock.pe || '—'}</p>
          <p>Дивиденд: ${stock.dividend || '—'}%</p>
        </div>

        <div class="card">
          <h3 class="section-title">🛡️ СТАТУС ПРОТОКОЛА</h3>
          <p>Без алкоголя: <strong style="color:var(--green)">4+ месяца</strong></p>
          <p>Вим Хоф: <strong>4 дня</strong></p>
          <p>Квал инвестор: <strong style="color:var(--green)">Q1 ✓</strong></p>
        </div>
      </div>
    `;
  } catch (e) {
    resultDiv.innerHTML = `<div style="color:red; padding:40px;">Ошибка: ${e.message}</div>`;
  }
}
</script>
</body>
</html>
