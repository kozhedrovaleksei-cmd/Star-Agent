<!DOCTYPE html>
<html lang="ru">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>WINE PRICE MONITOR</title>
<link href="https://fonts.googleapis.com/css2?family=Bebas+Neue&family=IBM+Plex+Mono:wght@400;600&family=IBM+Plex+Sans:wght@400;500;600&display=swap" rel="stylesheet">
<style>
* { margin:0; padding:0; box-sizing:border-box; }
:root {
  --bg:#F0F1F3; --bg2:#fff; --border:#D1D5DB;
  --gold:#B8960C; --green:#065F46; --red:#991B1B;
  --text:#111827; --dim:#6B7280;
  --shadow: 0 1px 4px rgba(0,0,0,0.08);
}
body { background:var(--bg); color:var(--text); font-family:'IBM Plex Sans',sans-serif; min-height:100vh; }
.hdr { background:var(--bg2); border-bottom:1px solid var(--border); padding:16px 28px; display:flex; align-items:center; justify-content:space-between; box-shadow:var(--shadow); }
.hdr-title { font-family:'Bebas Neue'; font-size:22px; letter-spacing:3px; }
.hdr-sub { font-size:11px; color:var(--dim); letter-spacing:1px; }
.main { padding:24px 28px; max-width:1200px; }

.search-card { background:var(--bg2); border:1px solid var(--border); border-radius:12px; padding:20px; margin-bottom:16px; box-shadow:var(--shadow); }
.search-row { display:flex; gap:12px; align-items:flex-end; flex-wrap:wrap; }
.input-group { display:flex; flex-direction:column; gap:5px; flex:1; min-width:180px; }
.input-label { font-size:10px; color:var(--dim); letter-spacing:1.5px; font-weight:700; text-transform:uppercase; }
.search-input { background:var(--bg); border:1px solid var(--border); color:var(--text); font-family:'IBM Plex Sans'; font-size:13px; padding:9px 12px; border-radius:7px; outline:none; transition:border-color 0.15s; }
.search-input:focus { border-color:var(--gold); }
.key-input { font-family:'IBM Plex Mono'; font-size:12px; }
.parse-btn { background:var(--gold); color:#fff; border:none; font-family:'Bebas Neue'; font-size:16px; letter-spacing:2px; padding:10px 24px; border-radius:8px; cursor:pointer; white-space:nowrap; box-shadow:0 2px 8px rgba(184,150,12,0.3); height:40px; }
.parse-btn:disabled { opacity:0.5; cursor:not-allowed; }

.status { font-size:12px; color:var(--dim); padding:6px 0 12px; min-height:28px; }
.loading-dot { display:inline-block; width:8px; height:8px; border-radius:50%; background:var(--gold); animation:blink 1s infinite; margin-right:6px; }
@keyframes blink { 0%,100%{opacity:1} 50%{opacity:0.2} }

.results-grid { display:grid; grid-template-columns:1fr 1fr; gap:16px; margin-bottom:16px; }
@media(max-width:700px) { .results-grid { grid-template-columns:1fr; } }

.shop-card { background:var(--bg2); border:1px solid var(--border); border-radius:12px; padding:16px; box-shadow:var(--shadow); }
.shop-title { font-family:'Bebas Neue'; font-size:17px; letter-spacing:2px; margin-bottom:12px; padding-bottom:10px; border-bottom:2px solid var(--bg); }
.shop-ws { color:#8B1A1A; border-color:#FCA5A5; }
.shop-wz { color:#1A3A8B; border-color:#93C5FD; }

.product-item { display:flex; justify-content:space-between; align-items:flex-start; padding:9px 0; border-bottom:1px solid var(--bg); gap:8px; }
.product-item:last-child { border-bottom:none; }
.product-name { font-size:12px; color:var(--text); line-height:1.4; flex:1; }
.product-price { font-family:'IBM Plex Mono'; font-size:14px; font-weight:600; color:var(--gold); white-space:nowrap; }
.product-url { font-size:10px; color:var(--dim); margin-top:2px; }

.compare-card { background:var(--bg2); border:1px solid var(--border); border-radius:12px; padding:16px; box-shadow:var(--shadow); margin-bottom:16px; }
.compare-title { font-family:'Bebas Neue'; font-size:17px; letter-spacing:2px; margin-bottom:12px; }
.compare-row { display:grid; grid-template-columns:2fr 1fr 1fr 1fr; gap:8px; padding:9px 0; border-bottom:1px solid var(--bg); font-size:12px; align-items:center; }
.compare-header { color:var(--dim); font-size:10px; font-weight:700; letter-spacing:1px; text-transform:uppercase; }
.diff-pos { color:var(--green); font-family:'IBM Plex Mono'; font-weight:600; }
.diff-neg { color:var(--red); font-family:'IBM Plex Mono'; font-weight:600; }
.tag { display:inline-block; font-size:9px; padding:1px 5px; border-radius:3px; font-weight:700; margin-left:4px; }
.tag-ws { background:#FEF2F2; color:var(--red); }
.tag-wz { background:#EFF6FF; color:#1E40AF; }
.empty { text-align:center; padding:24px; color:var(--dim); font-size:12px; line-height:1.6; }
</style>
</head>
<body>

<div class="hdr">
  <div>
    <div class="hdr-title">🍾 WINE PRICE MONITOR</div>
    <div class="hdr-sub">WINESHOPPER vs WINEZONE · ПОИСК ЧЕРЕЗ TAVILY · СРАВНЕНИЕ ЦЕН</div>
  </div>
  <a href="https://star-agent-murex.vercel.app" style="font-size:12px;color:var(--dim);text-decoration:none;">← STARK AGENT</a>
</div>

<div class="main">
  <div class="search-card">
    <div class="search-row">
      <div class="input-group" style="flex:2">
        <label class="input-label">Что ищем</label>
        <input type="text" id="queryInput" class="search-input" placeholder="Moet Chandon, Dom Perignon, Ruinart...">
      </div>
      <div class="input-group">
        <label class="input-label">Tavily API Key</label>
        <input type="password" id="tavilyKey" class="search-input key-input" placeholder="tvly-...">
      </div>
      <button class="parse-btn" id="parseBtn" onclick="startSearch()">🔍 НАЙТИ</button>
    </div>
    <div style="margin-top:10px;display:flex;gap:8px;flex-wrap:wrap">
      <span style="font-size:10px;color:var(--dim);align-self:center;letter-spacing:1px">БЫСТРЫЙ ВЫБОР:</span>
      <button onclick="setQuery('Moet Chandon шампанское')" style="padding:4px 10px;border-radius:5px;border:1px solid var(--border);background:var(--bg);font-size:11px;cursor:pointer">Moet Chandon</button>
      <button onclick="setQuery('Dom Perignon шампанское')" style="padding:4px 10px;border-radius:5px;border:1px solid var(--border);background:var(--bg);font-size:11px;cursor:pointer">Dom Perignon</button>
      <button onclick="setQuery('Ruinart шампанское')" style="padding:4px 10px;border-radius:5px;border:1px solid var(--border);background:var(--bg);font-size:11px;cursor:pointer">Ruinart</button>
      <button onclick="setQuery('Veuve Clicquot шампанское')" style="padding:4px 10px;border-radius:5px;border:1px solid var(--border);background:var(--bg);font-size:11px;cursor:pointer">Veuve Clicquot</button>
      <button onclick="setQuery('Bollinger шампанское')" style="padding:4px 10px;border-radius:5px;border:1px solid var(--border);background:var(--bg);font-size:11px;cursor:pointer">Bollinger</button>
      <button onclick="setQuery('Louis Roederer шампанское')" style="padding:4px 10px;border-radius:5px;border:1px solid var(--border);background:var(--bg);font-size:11px;cursor:pointer">Louis Roederer</button>
    </div>
  </div>

  <div id="statusLine" class="status"></div>
  <div id="resultsGrid" class="results-grid" style="display:none"></div>
  <div id="compareSection" style="display:none"></div>
</div>

<script>
const API = 'https://star-agent-murex.vercel.app/api/analyze';

// Load saved key
const savedKey = localStorage.getItem('tavily_key');
if (savedKey) document.getElementById('tavilyKey').value = savedKey;

function setQuery(q) { document.getElementById('queryInput').value = q; }

function setStatus(msg, loading=false) {
  document.getElementById('statusLine').innerHTML = loading
    ? `<span class="loading-dot"></span>${msg}`
    : msg;
}

async function tavilySearch(query, tavilyKey) {
  try {
    const r = await fetch(API, {
      method: 'POST',
      headers: { 'Content-Type': 'application/json' },
      body: JSON.stringify({
        action: 'search',
        query,
        tavilyKey
      })
    });
    const data = await r.json();
    return data.result || '';
  } catch(e) { return ''; }
}

function extractPrices(text, shopName) {
  const products = [];
  const lines = text.split('\n');

  lines.forEach(line => {
    // Ищем цены в формате 12 345 руб, 12345₽, 12 345 р.
    const priceMatch = line.match(/(\d[\d\s]{2,5})\s*(?:руб|₽|р\.|rub)/i);
    if (!priceMatch) return;

    const price = parseInt(priceMatch[1].replace(/\s/g, ''));
    if (price < 500 || price > 300000) return;

    // Название — текст до цены
    const namePart = line.slice(0, line.toLowerCase().indexOf(priceMatch[0].toLowerCase())).trim();
    const name = namePart
      .replace(/[*#\[\]|•→]/g, '')
      .replace(/https?:\/\/\S+/g, '')
      .replace(/\s+/g, ' ')
      .trim();

    if (name.length > 5 && name.length < 120) {
      products.push({ name, price, shop: shopName });
    }
  });

  // Дедупликация
  const seen = new Set();
  return products.filter(p => {
    const key = p.name.slice(0, 20).toLowerCase();
    if (seen.has(key)) return false;
    seen.add(key);
    return true;
  }).sort((a,b) => a.price - b.price).slice(0, 25);
}

function renderShop(products, shopName, colorClass) {
  if (!products.length) {
    return `<div class="shop-card">
      <div class="shop-title ${colorClass}">🍾 ${shopName} (0)</div>
      <div class="empty">Цены не найдены.<br>Попробуй другой запрос или добавь название бренда точнее.</div>
    </div>`;
  }
  return `<div class="shop-card">
    <div class="shop-title ${colorClass}">🍾 ${shopName} (${products.length})</div>
    ${products.map(p => `
      <div class="product-item">
        <div class="product-name">${p.name}</div>
        <div class="product-price">${p.price.toLocaleString('ru')} ₽</div>
      </div>`).join('')}
  </div>`;
}

function renderCompare(wsProducts, wzProducts) {
  const matches = [];

  wsProducts.forEach(ws => {
    wzProducts.forEach(wz => {
      const wsKey = ws.name.toLowerCase().replace(/[^а-яёa-z0-9]/gi,'').slice(0,15);
      const wzKey = wz.name.toLowerCase().replace(/[^а-яёa-z0-9]/gi,'').slice(0,15);
      if (wsKey.length > 5 && wzKey.length > 5 && (wsKey.includes(wzKey.slice(0,10)) || wzKey.includes(wsKey.slice(0,10)))) {
        const diff = wzProducts[0].price - wsProducts[0].price;
        matches.push({ name: ws.name, wsPrice: ws.price, wzPrice: wz.price, diff: wz.price - ws.price });
      }
    });
  });

  if (!matches.length) return '';

  return `<div class="compare-card">
    <div class="compare-title">📊 СОВПАДЕНИЯ — РАЗНИЦА ЦЕН</div>
    <div class="compare-row compare-header">
      <span>Позиция</span>
      <span>WineShopper</span>
      <span>WineZone</span>
      <span>Разница</span>
    </div>
    ${matches.map(m => {
      const diffClass = m.diff > 0 ? 'diff-neg' : 'diff-pos';
      const sign = m.diff > 0 ? '+' : '';
      const tag = m.diff > 200 ? '<span class="tag tag-ws">WS дешевле</span>' : m.diff < -200 ? '<span class="tag tag-wz">WZ дешевле</span>' : '';
      return `<div class="compare-row">
        <span>${m.name.slice(0,45)}${tag}</span>
        <span style="font-family:'IBM Plex Mono'">${m.wsPrice.toLocaleString('ru')} ₽</span>
        <span style="font-family:'IBM Plex Mono'">${m.wzPrice.toLocaleString('ru')} ₽</span>
        <span class="${diffClass}">${sign}${m.diff.toLocaleString('ru')} ₽</span>
      </div>`;
    }).join('')}
  </div>`;
}

async function startSearch() {
  const query = document.getElementById('queryInput').value.trim();
  const tavilyKey = document.getElementById('tavilyKey').value.trim();

  if (!query) { setStatus('⚠ Введи название шампанского'); return; }
  if (!tavilyKey) { setStatus('⚠ Введи Tavily API key'); return; }

  localStorage.setItem('tavily_key', tavilyKey);

  const btn = document.getElementById('parseBtn');
  btn.disabled = true;
  document.getElementById('resultsGrid').style.display = 'none';
  document.getElementById('compareSection').style.display = 'none';

  // Два параллельных поиска
  setStatus(`Ищем "${query}" на WineShopper и WineZone...`, true);

  const [wsRaw, wzRaw] = await Promise.all([
    tavilySearch(`${query} купить цена site:wine-shopper.ru`, tavilyKey),
    tavilySearch(`${query} купить цена site:winezone.ru`, tavilyKey)
  ]);

  setStatus('Извлекаем цены...', true);

  const wsProducts = extractPrices(wsRaw, 'WineShopper');
  const wzProducts = extractPrices(wzRaw, 'WineZone');

  // Если мало результатов — ищем без site:
  let wsExtra = [], wzExtra = [];
  if (wsProducts.length < 3) {
    const raw = await tavilySearch(`${query} wine-shopper.ru цена рублей`, tavilyKey);
    wsExtra = extractPrices(raw, 'WineShopper');
  }
  if (wzProducts.length < 3) {
    const raw = await tavilySearch(`${query} winezone.ru цена рублей`, tavilyKey);
    wzExtra = extractPrices(raw, 'WineZone');
  }

  const wsFinal = [...wsProducts, ...wsExtra].slice(0,25);
  const wzFinal = [...wzProducts, ...wzExtra].slice(0,25);

  document.getElementById('resultsGrid').style.display = 'grid';
  document.getElementById('resultsGrid').innerHTML =
    renderShop(wsFinal, 'WINESHOPPER', 'shop-ws') +
    renderShop(wzFinal, 'WINEZONE', 'shop-wz');

  const compareHtml = renderCompare(wsFinal, wzFinal);
  if (compareHtml) {
    document.getElementById('compareSection').style.display = 'block';
    document.getElementById('compareSection').innerHTML = compareHtml;
  }

  const total = wsFinal.length + wzFinal.length;
  setStatus(`✅ Найдено: WineShopper ${wsFinal.length} поз. · WineZone ${wzFinal.length} поз.`);
  btn.disabled = false;
}

document.addEventListener('keydown', e => {
  if (e.key === 'Enter') startSearch();
});
</script>
</body>
</html>
