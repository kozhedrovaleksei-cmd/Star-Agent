<style>

    --bg:#03050b; --glass:rgba(14,18,28,.66); --line:rgba(255,255,255,.08);
    --blue:#0a84ff; --blue-deep:#0071e3; --blue-soft:rgba(10,132,255,.16);
    --bull:#30d158; --bear:#ff453a; --neutral:#8a9099; --warn:#ff9f0a;
    --text:#f5f7fa; --dim:#9aa3af; --r:18px;
    --mono:'Inter',ui-monospace,'SF Mono',Menlo,monospace;

  html,body{height:100%;background:#03050b;color:var(--text);font-family:'Inter',-apple-system,sans-serif;overflow:hidden}

  .floatlab{transform:translate(-50%,-50%);pointer-events:none;white-space:nowrap;display:flex;align-items:center;gap:6px;font-family:var(--mono);font-size:11px;font-weight:800;background:rgba(8,12,20,.72);border:1px solid rgba(10,132,255,.45);border-radius:9px;padding:4px 8px;box-shadow:0 0 16px rgba(10,132,255,.35);backdrop-filter:blur(4px)}
  .floatlab .s{font-size:10px;font-weight:700}

  .conflict-mark{transform:translate(-50%,-50%);cursor:pointer;display:flex;flex-direction:column;align-items:center;gap:3px;font-family:var(--mono)}
  .conflict-mark .pin{width:14px;height:14px;border-radius:50%;background:var(--warn);box-shadow:0 0 14px var(--warn);animation:pulse 1.6s ease-out infinite}
  .conflict-mark .nm{font-size:9.5px;font-weight:800;color:#ffd79a;text-shadow:0 0 6px rgba(0,0,0,.9);white-space:nowrap}
  @keyframes pulse{0%{transform:scale(.7);opacity:1}70%{transform:scale(1.9);opacity:.15}100%{transform:scale(.7);opacity:1}}
  .plane-mark{transform:translate(-50%,-50%);pointer-events:none;font-size:12px;color:#7fd0ff;text-shadow:0 0 6px rgba(10,132,255,.8);opacity:.85}

  header{position:fixed;top:0;left:0;right:0;z-index:10;display:flex;align-items:center;justify-content:space-between;padding:14px 22px;background:linear-gradient(180deg,rgba(3,5,11,.9),transparent);backdrop-filter:blur(14px)}

  .status .live{width:7px;height:7px;border-radius:50%;background:var(--bull);box-shadow:0 0 10px var(--bull);animation:beat 2s infinite}

  #clusterbar{position:fixed;top:60px;left:0;right:0;z-index:9;display:flex;align-items:center;gap:10px;padding:8px 18px;background:linear-gradient(180deg,rgba(3,5,11,.7),transparent);backdrop-filter:blur(8px)}

  .chips{display:flex;gap:7px;overflow-x:auto;flex:1;padding-bottom:2px;scrollbar-width:none}

  .chip{flex:0 0 auto;display:flex;align-items:center;gap:6px;background:var(--glass);backdrop-filter:blur(12px);border:1px solid var(--line);border-radius:10px;padding:6px 11px;font-size:11px;font-weight:700;color:var(--text);cursor:pointer;white-space:nowrap;transition:.2s}

  .chip.on{background:var(--blue);border-color:var(--blue);color:#fff}
  .chip .cnt{font-family:var(--mono);font-size:10px;font-weight:800;opacity:.7}

  #layers{position:fixed;left:22px;bottom:158px;z-index:9;display:flex;flex-direction:column;gap:7px}
  .lyr{display:flex;align-items:center;gap:7px;background:var(--glass);backdrop-filter:blur(16px);border:1px solid var(--line);border-radius:11px;color:var(--dim);font-family:Inter;font-size:11px;font-weight:700;padding:7px 11px;cursor:pointer;transition:.2s;text-align:left}

  .lyr .cnt{font-family:var(--mono);font-size:10px;opacity:.7;margin-left:6px}

  .legend{position:fixed;left:22px;bottom:62px;z-index:9;display:flex;flex-direction:column;gap:7px;background:var(--glass);backdrop-filter:blur(20px);border:1px solid var(--line);border-radius:14px;padding:12px 14px}
  .legend .row{display:flex;align-items:center;gap:9px;font-size:11px;font-weight:600;color:var(--dim)}
  .legend .sw{width:9px;height:9px;border-radius:50%}
  .legend .arc-sw{width:18px;height:2px;border-radius:2px;background:linear-gradient(90deg,var(--blue),transparent)}

  #feed{position:fixed;top:106px;right:0;bottom:46px;width:340px;max-width:86vw;z-index:8;background:linear-gradient(270deg,rgba(3,5,11,.78),transparent);padding:14px 16px 24px;overflow-y:auto;transition:transform .4s cubic-bezier(.22,1,.36,1)}
  #feed.hidden{transform:translateX(102%)}
  #feed .ft{display:flex;align-items:center;justify-content:space-between;font-size:10px;letter-spacing:.18em;font-weight:800;color:var(--blue);margin-bottom:12px}
  #feed .ft .upd{color:var(--dim);letter-spacing:.04em;font-weight:600}
  .sigcard{background:var(--glass);backdrop-filter:blur(16px);border:1px solid var(--line);border-radius:14px;padding:11px 13px;margin-bottom:9px;cursor:pointer;transition:.2s;animation:slidein .5s ease}

  .sigcard .dir{font-size:9px;font-weight:800;letter-spacing:.08em;padding:2px 6px;border-radius:6px;text-transform:uppercase}
  .sigcard .imp{margin-left:auto;font-family:var(--mono);font-size:11px;font-weight:700;color:var(--dim)}
  .sigcard .hl{font-size:12px;line-height:1.4;color:var(--text);opacity:.92}
  .sigcard .meta{font-size:10px;color:var(--dim);margin-top:5px;font-weight:500}
  .feed-empty{font-size:12px;color:var(--dim);text-align:center;padding:30px 10px;line-height:1.6}

  #feedToggle{position:fixed;top:106px;right:14px;z-index:11;background:var(--glass);backdrop-filter:blur(16px);border:1px solid var(--line);border-radius:10px;color:var(--text);font-size:11px;font-weight:700;padding:7px 11px;cursor:pointer;display:none}
  @media (max-width:760px){#feed{width:100%}#feedToggle{display:block}.brand small{display:none}}

  #panel{position:fixed;top:0;right:0;bottom:0;width:360px;max-width:88vw;z-index:20;background:var(--glass);backdrop-filter:blur(26px);border-left:1px solid var(--line);transform:translateX(102%);transition:transform .42s cubic-bezier(.22,1,.36,1);padding:78px 24px 24px;overflow-y:auto}

  .p-tick{display:flex;align-items:baseline;gap:10px}
  .p-tick h2{font-size:30px;font-weight:900;font-family:var(--mono)}
  .p-badge{font-size:10px;font-weight:800;letter-spacing:.12em;padding:4px 9px;border-radius:8px;text-transform:uppercase}
  .p-name{font-size:12.5px;color:var(--dim);margin:3px 0 18px;font-weight:500}

  .sec-t{font-size:10px;letter-spacing:.2em;color:var(--dim);font-weight:700;text-transform:uppercase;margin:18px 0 9px}

  .sig .k{color:var(--dim);font-weight:500}
  .sig .v{font-weight:700;font-family:var(--mono);font-variant-numeric:tabular-nums}

  .seed-note{margin-top:22px;font-size:10.5px;line-height:1.5;color:var(--dim);background:var(--blue-soft);border:1px solid rgba(10,132,255,.3);border-radius:12px;padding:11px 13px}
  .warn-note{margin-top:8px;font-size:10.5px;line-height:1.5;color:#ffd79a;background:rgba(255,159,10,.1);border:1px solid rgba(255,159,10,.3);border-radius:12px;padding:11px 13px}

  .tape{position:fixed;left:0;right:0;bottom:0;z-index:9;height:46px;display:flex;align-items:center;overflow:hidden;background:linear-gradient(0deg,rgba(3,5,11,.94),rgba(3,5,11,.4));backdrop-filter:blur(14px);border-top:1px solid var(--line)}
  .tape .lbl{flex:0 0 auto;font-size:10px;letter-spacing:.18em;font-weight:800;color:var(--blue);padding:0 16px;border-right:1px solid var(--line)}
  .tape .track{display:flex;gap:30px;white-space:nowrap;animation:slide 36s linear infinite;padding-left:30px}
  .tape:hover .track{animation-play-state:paused}
  @keyframes slide{from{transform:translateX(0)}to{transform:translateX(-50%)}}
  .tchip{display:flex;align-items:center;gap:8px;font-size:12px;font-weight:600}
  .tchip .t{font-family:var(--mono);font-weight:800}.tchip .px{font-variant-numeric:tabular-nums;color:var(--dim)}.tchip .trg{font-size:10px;color:var(--blue);font-weight:700}

  .booting{position:fixed;inset:0;z-index:30;display:flex;align-items:center;justify-content:center;background:#03050b;font-size:12px;letter-spacing:.3em;color:var(--blue);font-weight:800;transition:opacity .6s}
  .booting.gone{opacity:0;pointer-events:none}
  @media (prefers-reduced-motion:reduce){*{animation:none!important;transition:none!important}}
</style>
</head>

function sectorOf(s){
  if(SECTOR_BY_TICKER[s.ticker]) return SECTOR_BY_TICKER[s.ticker];
  if(s.source==='crypto'||s.source==='kucoin') return 'Крипто';
  const txt=((s.sector||'')+' '+(s.company||'')).toLowerCase();
  if(/semicond|foundry|chip|gpu|\bai\b| artificial/.test(txt)) return 'Полупроводники / AI';
  if(/defense|aerospace|military|defence/.test(txt)) return 'Оборона / Аэрокосмос';
  if(/energy|\boil\b|\bgas\b|petro/.test(txt)) return 'Энергетика';
  if(/financ|bank|payment|insur/.test(txt)) return 'Финансы';
  if(/health|pharma|biotech|medical/.test(txt)) return 'Здравоохранение';
  if(/media|communicat|social|stream/.test(txt)) return 'Медиа / Комм';
  if(/consumer|retail|auto|apparel|electronics|mega/.test(txt)) return 'Потребительский';
  if(/industrial|manufactur|machin/.test(txt)) return 'Промышленность';
  return 'Прочее';
}
function regionOf(s){
  const la=+s.lat, ln=+s.lng;
  if(la>=15&&la<=72&&ln>=-170&&ln<=-50) return 'Северная Америка';
  if(la>=-40&&la<=15&&ln>=-85&&ln<=-30) return 'Южная Америка';
  if(la>=35&&la<=72&&ln>=-25&&ln<=45) return 'Европа';
  if(la>=12&&la<=42&&ln>=34&&ln<=63) return 'Ближний Восток';
  if(la>=-12&&la<=72&&ln>=60&&ln<=155) return 'Азия';
  return 'Прочий мир';
}
const REGION_CENTER={'Северная Америка':[39,-98],'Южная Америка':[-14,-55],'Европа':[52,13],'Ближний Восток':[27,45],'Азия':[30,110],'Прочий мир':[0,20]};

const COUNTRY_ALIAS={
  'United States':'United States of America','USA':'United States of America','US':'United States of America',
  'UK':'United Kingdom','Korea':'South Korea','UAE':'United Arab Emirates','Czech Republic':'Czechia'
};
function geoName(c){ if(!c) return null; return COUNTRY_ALIAS[c]||c; }

/* ════════ СОСТОЯНИЕ ════════ */
let world, liveSignals=[], mode='sector', active=null;
let countryLabels=[], labelsShown=false, countryFeats=[], countryAgg={};
let planes=[], layerConflicts=true, layerPlanes=true;

function init(){
  if(typeof Globe==='undefined'){fail('Не загрузился globe.gl. На Vercel загрузится.');return;}
  world=Globe()(document.getElementById('globe'))
    .backgroundColor('#03050b')
    .backgroundImageUrl('https://unpkg.com/three-globe/example/img/night-sky.png')
    .showAtmosphere(true).atmosphereColor('#0a84ff').atmosphereAltitude(0.22)
    .pointsData(allPoints()).pointLat('lat').pointLng('lng')
    .pointColor(d=>COL[d.dir]||COL.neutral)
    .pointAltitude(d=>d.dir==='chain'?0.01:0.04+(d.score||0)/260)
    .pointRadius(d=>d.dir==='chain'?0.2:0.32).pointResolution(18)
    .pointLabel(d=>`<div style="font-family:Inter;font-size:12px;color:#fff;background:rgba(8,12,20,.92);border:1px solid rgba(10,132,255,.4);border-radius:10px;padding:8px 11px"><b style="font-size:14px">${d.t}</b>${d.dir!=='chain'?' · STARK '+d.score:''}<br><span style="color:#9aa3af">${d.sector||''}</span></div>`)
    .onPointClick(d=>{ if(d.dir!=='chain'){ openPanelNode(d); world.controls().autoRotate=false; } })
    .arcsData(arcData)
    .arcColor(()=>['rgba(10,132,255,.05)','rgba(10,132,255,1)'])
    .arcDashLength(0.5).arcDashGap(0.22).arcDashAnimateTime(2400).arcStroke(0.55).arcAltitude(0.28).arcLabel('label')
    .htmlLat('lat').htmlLng('lng')
    .htmlAltitude(d=>d.kind==='label'?0.05+d.score/240:(d.kind==='plane'?0.05:0.02))
    .htmlElement(htmlEl)
    .labelsData([]).labelLat('lat').labelLng('lng').labelText('name')
    .labelSize(1.1).labelDotRadius(0).labelColor(()=>'rgba(230,240,255,.85)').labelResolution(1).labelAltitude(0.008);

  fetch('https://unpkg.com/world-atlas@2/countries-110m.json').then(r=>r.json()).then(topo=>{
    countryFeats=topojson.feature(topo,topo.objects.countries).features;
    /* база: гекс-сетка (HUD-текстура) */
    world.hexPolygonsData(countryFeats).hexPolygonResolution(3).hexPolygonMargin(0.4).hexPolygonUseDots(true)
      .hexPolygonColor(()=>'rgba(10,132,255,.18)').hexPolygonAltitude(0.003);
    /* границы (контуры) + choropleth-заливка по сигналам */
    world.polygonsData(countryFeats)
      .polygonCapColor(capColor)
      .polygonSideColor(()=>'rgba(10,132,255,.04)')
      .polygonStrokeColor(()=>'rgba(120,170,255,.4)')
      .polygonAltitude(f=>countryAgg[f.properties.name]?0.02:0.006);
    countryLabels=countryFeats.filter(f=>f.properties&&f.properties.name).map(f=>{const c=centroid(f.geometry);return {name:f.properties.name,lat:c[1],lng:c[0]};});
  }).catch(()=>world.globeImageUrl('https://unpkg.com/three-globe/example/img/earth-night.jpg'));

  world.controls().autoRotate=true; world.controls().autoRotateSpeed=0.42; world.controls().enableZoom=true;
  world.pointOfView({lat:34,lng:-110,altitude:2.2},0);
  setTimeout(()=>world.pointOfView({lat:28,lng:-30,altitude:2.5},4500),700);

  world.onZoom(pov=>{
    const show = pov.altitude < 1.7;
    if(show!==labelsShown){ labelsShown=show; world.labelsData(show?countryLabels:[]); }
    if(show) world.controls().autoRotate=false;
  });

  document.getElementById('chainCount').textContent=arcData.length;
  window.addEventListener('resize',()=>world.width(innerWidth).height(innerHeight));
  setTimeout(()=>document.getElementById('boot').classList.add('gone'),900);
  buildTape(); rebuildHtml();
  pollSignals(); setInterval(pollSignals, POLL_MS);
  pollPlanes(); setInterval(pollPlanes, PLANE_MS);
}
function allPoints(){ return [...NODES, ...CHAIN_NODES.map(n=>({...n,dir:'chain',score:0,sector:'Supply node'}))]; }
function fail(msg){const b=document.getElementById('boot');b.textContent=msg;b.style.letterSpacing='normal';b.style.fontWeight='500';b.style.color='#9aa3af';b.style.padding='30px';b.style.textAlign='center';}
function centroid(geom){let x=0,y=0,n=0;const walk=c=>{if(typeof c[0]==='number'){x+=c[0];y+=c[1];n++;}else c.forEach(walk);};walk(geom.coordinates);return[x/n,y/n];}

/* ════════ CHOROPLETH ════════ */
function capColor(f){
  const a=countryAgg[f.properties.name];
  if(!a) return 'rgba(0,0,0,0)';
  const intensity=Math.min(1, a.total/150)*0.5+0.12;
  if(a.net>2)  return `rgba(48,209,88,${intensity})`;
  if(a.net<-2) return `rgba(255,69,58,${intensity})`;
  return `rgba(138,144,153,${intensity*0.8})`;
}
function recomputeAgg(){
  countryAgg={};
  liveSignals.forEach(s=>{
    const nm=geoName(s.country); if(!nm) return;
    const sign=s.direction==='bull'?1:s.direction==='bear'?-1:0;
    const imp=+s.impact||0;
    (countryAgg[nm]=countryAgg[nm]||{net:0,total:0,count:0});
    countryAgg[nm].net+=sign*imp; countryAgg[nm].total+=imp; countryAgg[nm].count++;
  });
}

/* ════════ HTML-СЛОЙ (лейблы + зоны + борты) ════════ */
function htmlEl(d){
  if(d.kind==='conflict'){
    const el=document.createElement('div'); el.className='conflict-mark';
    el.innerHTML=`<div class="pin"></div><div class="nm">${d.name}</div>`;
    el.onclick=()=>openPanelConflict(d.idx);
    return el;
  }
  if(d.kind==='plane'){
    const el=document.createElement('div'); el.className='plane-mark';
    el.style.transform=`translate(-50%,-50%) rotate(${d.track||0}deg)`;
    el.title=`${d.callsign} ${d.type||''}`.trim(); el.textContent='✈';
    return el;
  }
  const el=document.createElement('div'); el.className='floatlab';
  el.innerHTML=`<span style="color:${COL[d.dir]}">${d.t}</span><span class="s" style="color:#9aa3af">${d.score}</span>`;
  return el;
}
function rebuildHtml(){
  if(!world) return;
  const labels=NODES.filter(n=>n.score>=72).map(n=>({...n,kind:'label'}));
  const confs=layerConflicts?CONFLICT_ZONES.map((z,i)=>({...z,idx:i,kind:'conflict'})):[];
  const pl=layerPlanes?planes:[];
  world.htmlElementsData([...labels,...confs,...pl]);
}
function toggleLayer(which){
  if(which==='conf'){ layerConflicts=!layerConflicts; document.getElementById('tglConf').classList.toggle('on',layerConflicts); }
  if(which==='plane'){ layerPlanes=!layerPlanes; document.getElementById('tglPlane').classList.toggle('on',layerPlanes); if(layerPlanes) pollPlanes(); }
  rebuildHtml();
}

/* ════════ ВОЕННЫЕ БОРТЫ (adsb.lol, best-effort) ════════ */
async function pollPlanes(){
  if(!layerPlanes) return;
  try{
    const r=await fetch(PLANE_URL,{headers:{'Accept':'application/json'}});
    if(!r.ok) throw new Error('HTTP '+r.status);
    const j=await r.json();
    const ac=j.ac||j.aircraft||[];
    planes=ac.filter(a=>a.lat!=null&&(a.lon!=null||a.lng!=null)).slice(0,140).map(a=>({
      kind:'plane', lat:+a.lat, lng:+(a.lon!=null?a.lon:a.lng),
      callsign:String(a.flight||a.r||'MIL').trim(), type:a.t||'', track:+a.track||0
    }));
    document.getElementById('planeCount').textContent=planes.length;
  }catch(e){
    planes=[]; document.getElementById('planeCount').textContent='—';
  }
  rebuildHtml();
}

/* ════════ LIVE СИГНАЛЫ ════════ */
async function pollSignals(){
  try{
    const r=await fetch(`${SUPA_URL}/rest/v1/signals?select=*&order=created_at.desc&limit=120`,{headers:{apikey:SUPA_KEY,Authorization:'Bearer '+SUPA_KEY}});
    if(!r.ok) throw new Error('HTTP '+r.status);
    const rows=await r.json(); liveSignals=Array.isArray(rows)?rows:[];
    const now=new Date().toLocaleTimeString('ru-RU',{hour:'2-digit',minute:'2-digit'});
    document.getElementById('updTime').textContent=now; document.getElementById('feedUpd').textContent=now;
    document.getElementById('sigCount').textContent=liveSignals.length;
    recomputeAgg(); renderChoropleth(); renderChips(); render();
  }catch(e){ document.getElementById('feedList').innerHTML=`<div class="feed-empty">Поток недоступен.<br><span style="font-size:10px">${e.message}</span></div>`; }
}
function renderChoropleth(){
  if(!world||!countryFeats.length) return;
  world.polygonCapColor(capColor).polygonAltitude(f=>countryAgg[f.properties.name]?0.02:0.006);
}

function clusterOf(s){ return mode==='sector'?sectorOf(s):regionOf(s); }
function renderChips(){
  const counts={};
  liveSignals.forEach(s=>{const c=clusterOf(s);counts[c]=(counts[c]||0)+1;});
  const order=Object.keys(counts).sort((a,b)=>counts[b]-counts[a]);
  const chips=document.getElementById('chips');
  let html=`<div class="chip ${active===null?'on':''}" onclick="pick(null)">Все <span class="cnt">${liveSignals.length}</span></div>`;
  html+=order.map(c=>`<div class="chip ${active===c?'on':''}" onclick="pick('${c.replace(/'/g,"\\'")}')">${c} <span class="cnt">${counts[c]}</span></div>`).join('');
  chips.innerHTML=html;
}
function pick(c){
  active=c; renderChips(); render();
  if(c){
    const subset=liveSignals.filter(s=>clusterOf(s)===c).filter(s=>s.lat!=null);
    let center;
    if(mode==='region'&&REGION_CENTER[c]) center=REGION_CENTER[c];
    else if(subset.length){ const la=subset.reduce((a,s)=>a+ +s.lat,0)/subset.length, ln=subset.reduce((a,s)=>a+ +s.lng,0)/subset.length; center=[la,ln]; }
    if(center){ world.controls().autoRotate=false; world.pointOfView({lat:center[0],lng:center[1],altitude:1.8},1000); }
  }
}
function setMode(m){
  mode=m; active=null;
  document.getElementById('modeSector').classList.toggle('on',m==='sector');
  document.getElementById('modeRegion').classList.toggle('on',m==='region');
  renderChips(); render();
}
function render(){
  const data = active===null?liveSignals:liveSignals.filter(s=>clusterOf(s)===active);
  const rings=data.filter(s=>s.lat!=null&&s.lng!=null).map(s=>{
    const imp=+s.impact||0, hot=imp>=70;
    return {lat:+s.lat,lng:+s.lng,col:COL[s.direction]||COL.neutral,speed:hot?2.6:1.2+imp/60,max:hot?5.5:2.5+imp/30,period:hot?900:1500};
  });
  world.ringsData(rings).ringColor(d=>t=>`rgba(${hexRgb(d.col)},${1-t})`).ringMaxRadius(d=>d.max).ringPropagationSpeed(d=>d.speed).ringRepeatPeriod(d=>d.period);
  document.getElementById('feedTitle').textContent = active===null?'ВЕСЬ РЫНОК':active.toUpperCase();
  const list=document.getElementById('feedList');
  if(!data.length){ list.innerHTML='<div class="feed-empty">Нет сигналов в этом кластере.</div>'; return; }
  list.innerHTML=data.slice(0,50).map(s=>{
    const c=COL[s.direction]||COL.neutral, dir={bull:'BULL',bear:'BEAR',neutral:'НЕЙТР'}[s.direction]||'—';
    const when=s.created_at?new Date(s.created_at).toLocaleTimeString('ru-RU',{hour:'2-digit',minute:'2-digit'}):'';
    const payload=encodeURIComponent(JSON.stringify(s));
    return `<div class="sigcard" onclick="openPanelSignal('${payload}')"><div class="top"><span class="tk">${esc(s.ticker||'—')}</span><span class="dir" style="background:${c}22;color:${c}">${dir}</span><span class="imp">${s.impact??''}</span></div><div class="hl">${esc(s.headline||s.company||'')}</div><div class="meta">${esc(clusterOf(s))}${when?' · '+when:''}</div></div>`;
  }).join('');
}

/* ════════ ПАНЕЛИ ════════ */
function ring(score,col){const c=2*Math.PI*42,off=c*(1-score/100);return`<svg width="92" height="92" viewBox="0 0 100 100"><circle cx="50" cy="50" r="42" fill="none" stroke="rgba(255,255,255,.08)" stroke-width="8"/><circle cx="50" cy="50" r="42" fill="none" stroke="${col}" stroke-width="8" stroke-linecap="round" stroke-dasharray="${c}" stroke-dashoffset="${off}" transform="rotate(-90 50 50)"/></svg>`;}
const SIG=[['scThesis','Тезис','25%'],['scAntic','Предвосхищение','25%'],['scInsider','Инсайдеры','15%'],['scMom','Моментум','15%'],['scRR','R:R','10%'],['scSent','Сентимент','10%']];
function chainsFor(t){return ARCS.filter(a=>a.from===t||a.to===t).map(a=>`<div class="lnk"><b>${a.from}</b><span class="arr">→</span><b>${a.to}</b></div><div style="font-size:11px;color:var(--dim);margin:-2px 0 4px 2px">${a.label}</div>`).join('');}
function openPanelNode(d){
  const col=COL[d.dir],badge={bull:'BULL',bear:'BEAR',neutral:'НЕЙТРАЛ'}[d.dir];
  const chains=chainsFor(d.t)||'<div style="font-size:12px;color:var(--dim)">прямых лид-зависимостей нет</div>';
  document.getElementById('panelBody').innerHTML=`
    <div class="p-tick"><h2>${d.t}</h2><span class="p-badge" style="background:${col}22;color:${col}">${badge}</span></div>
    <div class="p-name">${d.name}</div>
    <div class="ring-wrap"><div style="position:relative">${ring(d.score,col)}<div style="position:absolute;inset:0;display:flex;align-items:center;justify-content:center;font-family:var(--mono);font-weight:900;font-size:22px">${d.score}</div></div>
    <div class="val"><span class="big" style="color:${col}">${d.score}</span><span class="lab">STARK SCORE</span></div></div>
    <div class="geo">📍 ${d.lat.toFixed(2)}, ${d.lng.toFixed(2)} · ${d.sector}</div>
    <div class="sec-t">Сигналы</div>
    ${SIG.map(([k,l,w])=>`<div class="sig"><span class="k">${l} <span style="opacity:.5">${w}</span></span><span class="v" style="color:${d[k]>=70?'var(--bull)':d[k]<50?'var(--bear)':'var(--text)'}">${d[k]??'—'}</span></div>`).join('')}
    <div class="sec-t">Цепочки поставок / лиды</div><div class="chain">${chains}</div>
    <div class="seed-note"><b>ВОТЧЛИСТ · посев.</b> Полный STARK Score. Live-сигналы из потока показывают факты по событию.</div>`;
  document.getElementById('panel').classList.add('open'); flyTo(d.lat,d.lng);
}
function openPanelSignal(payload){
  let s; try{ s=JSON.parse(decodeURIComponent(payload)); }catch(e){ return; }
  const col=COL[s.direction]||COL.neutral, badge={bull:'BULL',bear:'BEAR',neutral:'НЕЙТРАЛ'}[s.direction]||'—', imp=s.impact??0;
  const chains = byT[s.ticker] ? chainsFor(s.ticker) : '';
  const when=s.created_at?new Date(s.created_at).toLocaleString('ru-RU',{day:'2-digit',month:'2-digit',hour:'2-digit',minute:'2-digit'}):'';
  document.getElementById('panelBody').innerHTML=`
    <div class="p-tick"><h2>${esc(s.ticker||'—')}</h2><span class="p-badge" style="background:${col}22;color:${col}">${badge}</span></div>
    <div class="p-name">${esc(s.company||clusterOf(s))}</div>
    <div class="ring-wrap"><div style="position:relative">${ring(imp,col)}<div style="position:absolute;inset:0;display:flex;align-items:center;justify-content:center;font-family:var(--mono);font-weight:900;font-size:22px">${imp}</div></div>
    <div class="val"><span class="big" style="color:${col}">${imp}</span><span class="lab">IMPACT</span></div></div>
    <div class="geo">📍 ${s.lat!=null?(+s.lat).toFixed(2)+', '+(+s.lng).toFixed(2):'—'} · ${esc(s.country||clusterOf(s))}</div>
    <div class="sec-t">Событие</div>
    <div class="p-hl">${esc(s.headline||'—')}</div>
    ${s.url?`<a href="${esc(s.url)}" target="_blank" style="font-size:11px;color:var(--blue);font-weight:700;text-decoration:none">Источник ↗</a>`:''}
    <div class="sig"><span class="k">Сектор</span><span class="v" style="font-size:11px">${esc(clusterOf(s))}</span></div>
    <div class="sig"><span class="k">Направление</span><span class="v" style="color:${col}">${badge}</span></div>
    <div class="sig"><span class="k">Время</span><span class="v" style="font-size:11px">${when||'—'}</span></div>
    ${chains?`<div class="sec-t">Цепочки поставок / лиды</div><div class="chain">${chains}</div>`:''}
    <div class="seed-note"><b>LIVE-СИГНАЛ.</b> Полный STARK Score появится, когда классификатор начнёт его считать. Сейчас — факты по событию из источника.</div>`;
  document.getElementById('panel').classList.add('open'); if(s.lat!=null) flyTo(+s.lat,+s.lng);
}
function openPanelConflict(idx){
  const z=CONFLICT_ZONES[idx]; if(!z) return;
  const chips=z.tickers.map(t=>`<span class="tk-chip">${t}</span>`).join('');
  document.getElementById('panelBody').innerHTML=`
    <div class="p-tick"><h2 style="font-size:22px">${z.name}</h2><span class="p-badge" style="background:rgba(255,159,10,.18);color:var(--warn)">ЗОНА РИСКА</span></div>
    <div class="p-name">📍 ${z.lat.toFixed(2)}, ${z.lng.toFixed(2)}</div>
    <div class="sec-t">Тикеры под влиянием</div>
    <div style="margin-bottom:6px">${chips}</div>
    <div class="sec-t">Рыночное эхо</div>
    <div class="p-hl">${z.note}</div>
    <div class="warn-note"><b>Статичная зона риска.</b> Геополитический маркер — какие тикеры двигает обострение в регионе. Не live-данные о боевых действиях, а карта связей «катализатор → сектор».</div>`;
  document.getElementById('panel').classList.add('open'); flyTo(z.lat,z.lng);
}
function closePanel(){document.getElementById('panel').classList.remove('open');if(world)world.controls().autoRotate=true;}
function flyTo(lat,lng){if(world&&lat!=null){world.controls().autoRotate=false;world.pointOfView({lat,lng,altitude:1.5},1000);}}
function esc(s){return String(s).replace(/[&<>"]/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;'}[c]));}

function buildTape(){const t=CRYPTO.map(c=>`<span class="tchip"><span class="t">${c.t}</span><span class="px">${c.px}</span><span class="trg">${c.trg}</span></span>`).join('');document.getElementById('tapeTrack').innerHTML=t+t;}

init();
</script>
</body>
</html>
