<!DOCTYPE html>
<html lang="ru">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>STARK · ГЛОБУС</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700;800;900&display=swap" rel="stylesheet">
<script src="https://unpkg.com/globe.gl"></script>
<script src="https://unpkg.com/topojson-client@3"></script>
<style>
  :root{
    --bg:#03050b; --glass:rgba(14,18,28,.66); --line:rgba(255,255,255,.08);
    --blue:#0a84ff; --blue-deep:#0071e3; --blue-soft:rgba(10,132,255,.16);
    --bull:#30d158; --bear:#ff453a; --neutral:#8a9099; --warn:#ff9f0a;
    --oil:#c9a227; --metal:#d8dde3; --agro:#7ed957;
    --text:#f5f7fa; --dim:#9aa3af; --r:18px;
    --mono:'Inter',ui-monospace,'SF Mono',Menlo,monospace;
  }
  *{box-sizing:border-box;margin:0;padding:0}
  html,body{height:100%;background:#03050b;color:var(--text);font-family:'Inter',-apple-system,sans-serif;overflow:hidden}
  #globe{position:fixed;inset:0;z-index:1}#globe canvas{display:block}
  .vignette{position:fixed;inset:0;z-index:2;pointer-events:none;background:radial-gradient(120% 120% at 50% 45%,transparent 50%,rgba(3,5,11,.5) 80%,rgba(3,5,11,.92) 100%)}

  .floatlab{transform:translate(-50%,-50%);pointer-events:none;white-space:nowrap;display:flex;align-items:center;gap:6px;font-family:var(--mono);font-size:11px;font-weight:800;background:rgba(8,12,20,.72);border:1px solid rgba(10,132,255,.5);border-radius:9px;padding:4px 8px;box-shadow:0 0 18px rgba(10,132,255,.4);backdrop-filter:blur(4px)}
  .floatlab .s{font-size:10px;font-weight:700}
  .uni-lbl{transform:translate(-50%,-50%);pointer-events:none;font-family:var(--mono);font-size:9px;font-weight:800;color:#8fc4ff;text-shadow:0 0 5px rgba(0,0,0,.95);opacity:.85;white-space:nowrap}

  .conflict-mark{transform:translate(-50%,-50%);cursor:pointer;display:flex;flex-direction:column;align-items:center;gap:3px;font-family:var(--mono)}
  .conflict-mark .pin{width:13px;height:13px;border-radius:50%;background:var(--warn);box-shadow:0 0 14px var(--warn);animation:pulse 2s ease-out infinite}
  .conflict-mark .nm{font-size:9px;font-weight:800;color:#ffd79a;text-shadow:0 0 6px rgba(0,0,0,.9);white-space:nowrap}
  @keyframes pulse{0%{transform:scale(.7);opacity:1}70%{transform:scale(1.7);opacity:.15}100%{transform:scale(.7);opacity:1}}
  .plane-mark{transform:translate(-50%,-50%);pointer-events:none;font-size:11px;color:#7fd0ff;text-shadow:0 0 6px rgba(10,132,255,.8);opacity:.8}
  .commo-mark{transform:translate(-50%,-50%);cursor:pointer;display:flex;flex-direction:column;align-items:center;gap:2px;font-family:var(--mono)}
  .commo-mark .dot{border-radius:50%;box-shadow:0 0 12px currentColor}
  .commo-mark .nm{font-size:9px;font-weight:800;text-shadow:0 0 6px rgba(0,0,0,.95);white-space:nowrap}

  header{position:fixed;top:0;left:0;right:0;z-index:10;display:flex;align-items:center;justify-content:space-between;padding:14px 22px 14px 64px;background:linear-gradient(180deg,rgba(3,5,11,.9),transparent);backdrop-filter:blur(14px)}
  .brand{display:flex;align-items:center;gap:12px}
  .brand .dot{width:9px;height:9px;border-radius:50%;background:var(--blue);box-shadow:0 0 16px var(--blue);animation:beat 2.4s ease-in-out infinite}
  @keyframes beat{0%,100%{opacity:.55;transform:scale(.85)}50%{opacity:1;transform:scale(1.15)}}
  .brand h1{font-size:15px;font-weight:900;letter-spacing:.14em}.brand h1 span{color:var(--blue)}
  .brand small{display:block;font-size:9.5px;letter-spacing:.32em;color:var(--dim);font-weight:600;margin-top:1px}
  .status{display:flex;align-items:center;gap:14px;font-size:11px;color:var(--dim);font-weight:600}
  .status .grp{display:flex;align-items:center;gap:7px}
  .status .live{width:7px;height:7px;border-radius:50%;background:var(--bull);box-shadow:0 0 10px var(--bull);animation:beat 2s infinite}
  .status b{color:var(--text);font-variant-numeric:tabular-nums}

  /* ── БУРГЕР + ВЫЕЗДНОЕ МЕНЮ ── */
  #burger{position:fixed;top:14px;left:18px;z-index:22;width:38px;height:38px;display:flex;flex-direction:column;align-items:center;justify-content:center;gap:4px;background:var(--glass);backdrop-filter:blur(16px);border:1px solid var(--line);border-radius:11px;cursor:pointer;transition:.2s}
  #burger:hover{border-color:rgba(10,132,255,.5)}
  #burger span{width:16px;height:2px;background:var(--text);border-radius:2px;transition:.25s}
  #burger.open span:nth-child(1){transform:translateY(6px) rotate(45deg)}
  #burger.open span:nth-child(2){opacity:0}
  #burger.open span:nth-child(3){transform:translateY(-6px) rotate(-45deg)}

  #drawer{position:fixed;top:0;left:0;bottom:0;width:300px;max-width:86vw;z-index:21;background:rgba(8,11,18,.92);backdrop-filter:blur(26px);border-right:1px solid var(--line);transform:translateX(-104%);transition:transform .4s cubic-bezier(.22,1,.36,1);padding:62px 0 20px;overflow-y:auto;scrollbar-width:thin}
  #drawer.open{transform:translateX(0)}
  #drawer .dr-head{padding:0 20px 14px;font-size:10px;letter-spacing:.24em;font-weight:800;color:var(--blue)}
  .mcat{border-top:1px solid var(--line)}
  .mcat>.mcat-h{display:flex;align-items:center;gap:10px;padding:13px 20px;cursor:pointer;font-size:13px;font-weight:800;color:var(--text);transition:.15s;user-select:none}
  .mcat>.mcat-h:hover{background:rgba(255,255,255,.03)}
  .mcat>.mcat-h .ico{font-size:15px;width:20px;text-align:center}
  .mcat>.mcat-h .arr{margin-left:auto;font-size:10px;color:var(--dim);transition:.25s}
  .mcat.open>.mcat-h .arr{transform:rotate(90deg)}
  .mcat .msub{max-height:0;overflow:hidden;transition:max-height .3s ease}
  .mcat.open .msub{max-height:600px}
  .mitem{display:flex;align-items:center;gap:9px;padding:9px 20px 9px 50px;cursor:pointer;font-size:12px;font-weight:600;color:var(--dim);transition:.15s;border-left:2px solid transparent}
  .mitem:hover{background:rgba(255,255,255,.03);color:var(--text)}
  .mitem.on{color:#fff;border-left-color:var(--blue);background:var(--blue-soft)}
  .mitem .mi-dot{width:7px;height:7px;border-radius:50%;flex:0 0 auto}
  .mitem .mi-cnt{margin-left:auto;font-family:var(--mono);font-size:10px;font-weight:800;opacity:.6}
  .mitem .mi-soon{margin-left:auto;font-size:8.5px;letter-spacing:.1em;font-weight:800;color:var(--warn);background:rgba(255,159,10,.14);border-radius:6px;padding:2px 6px}
  #drawerScrim{position:fixed;inset:0;z-index:20;background:rgba(3,5,11,.4);opacity:0;pointer-events:none;transition:opacity .3s}
  #drawerScrim.on{opacity:1;pointer-events:auto}

  #clusterbar{position:fixed;top:60px;left:0;right:0;z-index:9;display:flex;align-items:center;gap:10px;padding:8px 18px;background:linear-gradient(180deg,rgba(3,5,11,.7),transparent);backdrop-filter:blur(8px)}
  .toggle{display:flex;background:rgba(255,255,255,.06);border:1px solid var(--line);border-radius:11px;padding:3px;flex:0 0 auto}
  .toggle button{border:none;background:none;color:var(--dim);font-family:Inter;font-size:11px;font-weight:700;padding:5px 12px;border-radius:8px;cursor:pointer;transition:.2s}
  .toggle button.on{background:var(--blue);color:#fff}
  .chips{display:flex;gap:7px;overflow-x:auto;flex:1;padding-bottom:2px;scrollbar-width:none}
  .chips::-webkit-scrollbar{display:none}
  .chip{flex:0 0 auto;display:flex;align-items:center;gap:6px;background:var(--glass);backdrop-filter:blur(12px);border:1px solid var(--line);border-radius:10px;padding:6px 11px;font-size:11px;font-weight:700;color:var(--text);cursor:pointer;white-space:nowrap;transition:.2s}
  .chip:hover{border-color:rgba(10,132,255,.5)}
  .chip.on{background:var(--blue);border-color:var(--blue);color:#fff}
  .chip .cnt{font-family:var(--mono);font-size:10px;font-weight:800;opacity:.7}.chip.on .cnt{opacity:.9}
  #clusterbar.muted{opacity:.4;pointer-events:none}

  .legend{position:fixed;left:22px;bottom:62px;z-index:9;display:flex;flex-direction:column;gap:7px;background:var(--glass);backdrop-filter:blur(20px);border:1px solid var(--line);border-radius:14px;padding:12px 14px}
  .legend .row{display:flex;align-items:center;gap:9px;font-size:11px;font-weight:600;color:var(--dim)}
  .legend .sw{width:9px;height:9px;border-radius:50%}
  .legend .arc-sw{width:18px;height:2px;border-radius:2px;background:linear-gradient(90deg,var(--blue),transparent)}

  #feed{position:fixed;top:106px;right:0;bottom:46px;width:340px;max-width:86vw;z-index:8;background:linear-gradient(270deg,rgba(3,5,11,.78),transparent);padding:14px 16px 24px;overflow-y:auto;transition:transform .4s cubic-bezier(.22,1,.36,1)}
  #feed.hidden{transform:translateX(102%)}
  #feed .ft{display:flex;align-items:center;justify-content:space-between;font-size:10px;letter-spacing:.18em;font-weight:800;color:var(--blue);margin-bottom:12px}
  #feed .ft .upd{color:var(--dim);letter-spacing:.04em;font-weight:600}
  .sigcard{background:var(--glass);backdrop-filter:blur(16px);border:1px solid var(--line);border-radius:14px;padding:11px 13px;margin-bottom:9px;cursor:pointer;transition:.2s;animation:slidein .5s ease}
  .sigcard:hover{border-color:rgba(10,132,255,.5);transform:translateX(-3px)}
  .sigcard.fresh{border-color:rgba(48,209,88,.6);box-shadow:0 0 22px rgba(48,209,88,.25);animation:flashin .9s ease}
  @keyframes slidein{from{opacity:0;transform:translateX(20px)}to{opacity:1;transform:translateX(0)}}
  @keyframes flashin{0%{opacity:0;transform:translateX(20px);box-shadow:0 0 34px rgba(48,209,88,.6)}100%{opacity:1;transform:translateX(0)}}
  .sigcard .top{display:flex;align-items:center;gap:8px;margin-bottom:5px}
  .sigcard .tk{font-family:var(--mono);font-weight:800;font-size:13px}
  .sigcard .dir{font-size:9px;font-weight:800;letter-spacing:.08em;padding:2px 6px;border-radius:6px;text-transform:uppercase}
  .sigcard .imp{margin-left:auto;font-family:var(--mono);font-size:11px;font-weight:700;color:var(--dim)}
  .sigcard .hl{font-size:12px;line-height:1.4;color:var(--text);opacity:.92}
  .sigcard .meta{font-size:10px;color:var(--dim);margin-top:5px;font-weight:500}
  .feed-empty{font-size:12px;color:var(--dim);text-align:center;padding:30px 10px;line-height:1.6}
  .commocard{background:var(--glass);backdrop-filter:blur(16px);border:1px solid var(--line);border-radius:14px;padding:11px 13px;margin-bottom:9px;cursor:pointer;transition:.2s}
  .commocard:hover{border-color:rgba(201,162,39,.5);transform:translateX(-3px)}
  .commocard .top{display:flex;align-items:center;gap:8px;margin-bottom:4px}
  .commocard .rk{font-family:var(--mono);font-weight:800;font-size:12px;color:var(--oil)}
  .commocard .ct{font-weight:700;font-size:13px}
  .commocard .vol{margin-left:auto;font-family:var(--mono);font-size:11px;color:var(--dim)}
  .commocard .share{font-size:10px;color:var(--dim);margin-top:2px}

  #feedToggle{position:fixed;top:106px;right:14px;z-index:11;background:var(--glass);backdrop-filter:blur(16px);border:1px solid var(--line);border-radius:10px;color:var(--text);font-size:11px;font-weight:700;padding:7px 11px;cursor:pointer;display:none}
  @media (max-width:760px){#feed{width:100%}#feedToggle{display:block}.brand small{display:none}}

  #panel{position:fixed;top:0;right:0;bottom:0;width:380px;max-width:90vw;z-index:25;background:var(--glass);backdrop-filter:blur(26px);border-left:1px solid var(--line);transform:translateX(102%);transition:transform .42s cubic-bezier(.22,1,.36,1);padding:78px 24px 24px;overflow-y:auto}
  #panel.open{transform:translateX(0)}
  #panel .close{position:absolute;top:18px;right:18px;width:30px;height:30px;border:none;border-radius:50%;background:rgba(255,255,255,.08);color:var(--text);font-size:16px;cursor:pointer;line-height:1}
  .p-tick{display:flex;align-items:baseline;gap:10px}
  .p-tick h2{font-size:30px;font-weight:900;font-family:var(--mono)}
  .p-badge{font-size:10px;font-weight:800;letter-spacing:.12em;padding:4px 9px;border-radius:8px;text-transform:uppercase}
  .p-name{font-size:12.5px;color:var(--dim);margin:3px 0 18px;font-weight:500}
  .ring-wrap{display:flex;align-items:center;gap:18px;margin-bottom:20px}
  .ring-wrap .val .big{font-size:34px;font-weight:900;font-family:var(--mono);line-height:1}
  .ring-wrap .val .lab{font-size:10px;letter-spacing:.22em;color:var(--dim);font-weight:700;margin-top:4px}
  .geo{font-size:11px;color:var(--dim);margin-bottom:18px;font-weight:600}
  .sec-t{font-size:10px;letter-spacing:.2em;color:var(--dim);font-weight:700;text-transform:uppercase;margin:18px 0 9px}
  .sig{display:flex;justify-content:space-between;align-items:center;padding:9px 0;border-bottom:1px solid var(--line);font-size:12.5px}
  .sig .k{color:var(--dim);font-weight:500}
  .sig .v{font-weight:700;font-family:var(--mono);font-variant-numeric:tabular-nums}
  .p-hl{font-size:13px;line-height:1.55;color:var(--text);background:rgba(255,255,255,.04);border:1px solid var(--line);border-radius:12px;padding:11px 13px;margin-bottom:6px}
  .chain{display:flex;flex-direction:column;gap:8px}
  .chain .lnk{display:flex;align-items:center;gap:9px;font-size:12px;background:rgba(255,255,255,.04);border:1px solid var(--line);border-radius:12px;padding:10px 12px}
  .chain .lnk .arr{color:var(--blue);font-weight:800}.chain .lnk b{font-family:var(--mono)}
  .tk-chip{display:inline-flex;align-items:center;font-family:var(--mono);font-weight:800;font-size:12px;background:var(--blue-soft);border:1px solid rgba(10,132,255,.4);color:#9fd0ff;border-radius:8px;padding:5px 9px;margin:0 6px 6px 0}
  .seed-note{margin-top:18px;font-size:10.5px;line-height:1.5;color:var(--dim);background:var(--blue-soft);border:1px solid rgba(10,132,255,.3);border-radius:12px;padding:11px 13px}
  .warn-note{margin-top:8px;font-size:10.5px;line-height:1.5;color:#ffd79a;background:rgba(255,159,10,.1);border:1px solid rgba(255,159,10,.3);border-radius:12px;padding:11px 13px}
  .soon-note{margin-top:8px;font-size:11px;line-height:1.55;color:var(--dim);background:rgba(255,255,255,.04);border:1px dashed var(--line);border-radius:12px;padding:13px}
  /* ── live-анализ ── */
  .ana-btn{width:100%;display:flex;align-items:center;justify-content:center;gap:8px;font-family:'Inter';font-size:13px;font-weight:800;letter-spacing:.02em;color:#cfe6ff;background:linear-gradient(180deg,rgba(10,132,255,.22),rgba(10,132,255,.1));border:1px solid rgba(10,132,255,.45);border-radius:12px;padding:13px;cursor:pointer;transition:.18s}
  .ana-btn:hover{background:rgba(10,132,255,.3);border-color:rgba(10,132,255,.7);color:#fff;box-shadow:0 0 22px rgba(10,132,255,.3)}
  .ana-btn:active{transform:scale(.985)}
  .ana-price{display:flex;align-items:baseline;gap:10px;flex-wrap:wrap;margin-bottom:4px}
  .ana-price .px{font-family:var(--mono);font-weight:900;font-size:26px;color:var(--text);font-variant-numeric:tabular-nums}
  .ana-price .cn{font-size:12px;color:var(--dim);font-weight:500}
  .rngbar{position:relative;height:8px;border-radius:6px;background:rgba(255,255,255,.07);margin:6px 0 7px;overflow:visible}
  .rngfill{position:absolute;left:0;top:0;height:100%;border-radius:6px;opacity:.55}
  .rngdot{position:absolute;top:50%;width:13px;height:13px;border-radius:50%;background:#fff;box-shadow:0 0 10px rgba(255,255,255,.7);transform:translate(-50%,-50%)}
  .rnglab{display:flex;justify-content:space-between;font-family:var(--mono);font-size:10.5px;color:var(--dim);font-variant-numeric:tabular-nums}
  .spin{width:22px;height:22px;border:2px solid rgba(255,255,255,.15);border-top-color:var(--blue);border-radius:50%;animation:rot .8s linear infinite;margin:16px auto}
  @keyframes rot{to{transform:rotate(360deg)}}
  .loadmsg{text-align:center;font-size:11px;color:var(--dim);font-weight:600}

  .tape{position:fixed;left:0;right:0;bottom:0;z-index:9;height:46px;display:flex;align-items:center;overflow:hidden;background:linear-gradient(0deg,rgba(3,5,11,.94),rgba(3,5,11,.4));backdrop-filter:blur(14px);border-top:1px solid var(--line)}
  .tape .lbl{flex:0 0 auto;font-size:10px;letter-spacing:.18em;font-weight:800;color:var(--blue);padding:0 16px;border-right:1px solid var(--line)}
  .tape .track{display:flex;gap:30px;white-space:nowrap;animation:slide 36s linear infinite;padding-left:30px}
  .tape:hover .track{animation-play-state:paused}
  @keyframes slide{from{transform:translateX(0)}to{transform:translateX(-50%)}}
  .tchip{display:flex;align-items:center;gap:8px;font-size:12px;font-weight:600}
  .tchip .t{font-family:var(--mono);font-weight:800}.tchip .px{font-variant-numeric:tabular-nums;color:var(--dim)}.tchip .trg{font-size:10px;color:var(--blue);font-weight:700}

  .booting{position:fixed;inset:0;z-index:30;display:flex;align-items:center;justify-content:center;background:#03050b;font-size:12px;letter-spacing:.3em;color:var(--blue);font-weight:800;transition:opacity .6s}
  .booting.gone{opacity:0;pointer-events:none}
  @media (prefers-reduced-motion:reduce){*{animation:none!important;transition:none!important}}
</style>
</head>
<body>

<div class="booting" id="boot">ИНИЦИАЛИЗАЦИЯ ШАРА…</div>
<div id="globe"></div>
<div class="vignette"></div>

<div id="burger" onclick="toggleDrawer()"><span></span><span></span><span></span></div>
<div id="drawerScrim" onclick="toggleDrawer(false)"></div>
<nav id="drawer"><div class="dr-head">НАВИГАЦИЯ STARK</div><div id="menuTree"></div></nav>

<header>
  <div class="brand"><div class="dot"></div><div><h1><span>STARK</span> · ГЛОБУС</h1><small>I AM IRON MAN · GLOBAL SIGNAL TERMINAL</small></div></div>
  <div class="status"><span class="grp"><span class="live"></span>LIVE</span><span class="grp"><b id="sigCount">0</b> сигналов</span><span class="grp"><b id="uniCount">0</b> акций</span><span class="grp">обновлено <b id="updTime">—</b></span></div>
</header>

<div id="clusterbar">
  <div class="toggle">
    <button id="modeSector" class="on" onclick="setMode('sector')">Секторы</button>
    <button id="modeRegion" onclick="setMode('region')">Регионы</button>
  </div>
  <div class="chips" id="chips"></div>
</div>

<button id="feedToggle" onclick="document.getElementById('feed').classList.toggle('hidden')">☰ Лента</button>

<div class="legend" id="legend">
  <div class="row"><span class="sw" style="background:var(--bull)"></span>BULL — тезис в силе</div>
  <div class="row"><span class="sw" style="background:var(--bear)"></span>BEAR — давление</div>
  <div class="row"><span class="sw" style="background:#5aafff"></span>акция вселенной</div>
  <div class="row"><span class="arc-sw"></span>цепочка / новость</div>
</div>

<div id="feed">
  <div class="ft"><span id="feedTitle">ВЕСЬ РЫНОК</span><span class="upd" id="feedUpd"></span></div>
  <div id="feedList"><div class="feed-empty">Подключаюсь к потоку…</div></div>
</div>

<div id="panel"><button class="close" onclick="closePanel()">✕</button><div id="panelBody"></div></div>

<div class="tape"><div class="lbl">КРИПТО · WATCH</div><div class="track" id="tapeTrack"></div></div>

<script>
/* ════════ КОНФИГ ════════ */
const SUPA_URL = 'https://wfoyypwscvcxriqbsnew.supabase.co';
const SUPA_KEY = 'sb_publishable_EwMdgEUXGLLlygEgzfNwYw_XcirqHgg';
const POLL_MS = 60000, PLANE_MS = 45000;
const PLANE_URL = 'https://api.adsb.lol/v2/mil';
const ANALYZE_URL  = '/api/analyze';
const UNIVERSE_API = '/api/universe-geo';

/* ════════════════════════════════════════════════════════════════
   MENU — ДЕРЕВО-КОНФИГ. ЕДИНЫЙ ИСТОЧНИК НАВИГАЦИИ.
   Добавить слой = дописать объект в sub[]. Вёрстку трогать НЕ нужно.
   Поля пункта:
     id     — уникальный ключ (активный слой хранится по нему)
     label  — что в меню
     type   — 'signals' | 'zones' | 'commodity' | 'planes'
     dot    — цвет точки в меню (опц.)
     data   — ключ набора данных для commodity/zones (см. COMMODITIES/ZONE_SETS)
     soon   — true → пункт-заглушка (гнездо готово, данных пока нет)
   ════════════════════════════════════════════════════════════════ */

const SECTOR_BY_TICKER = {};
function nodeSectorRu(s){
  return s==='Foundry'||s==='Semis / AI' ? 'Полупроводники / AI'
       : s==='Mega-cap'                  ? 'Мега-тех'
       : s==='Defense'                   ? 'Оборона / Аэрокосмос'
       : (s==='Consumer'||s==='Auto / EV') ? 'Потребительский'
       : 'Прочее';
}
function rebuildSectorMap(){
  for(const k in SECTOR_BY_TICKER) delete SECTOR_BY_TICKER[k];
  [...NODES.map(n=>[n.t,nodeSectorRu(n.sector)]),
   ...UNIVERSE.map(n=>[n.t,n.sector])].forEach(([t,s])=>{SECTOR_BY_TICKER[t]=s;});
  ['TAO','RNDR','FET','SUI','LINK','BTC','ETH'].forEach(t=>SECTOR_BY_TICKER[t]='Крипто');
  SECTOR_BY_TICKER['SMCI']='Полупроводники / AI';
}
rebuildSectorMap();

function sectorOf(s){
  if(SECTOR_BY_TICKER[s.ticker]) return SECTOR_BY_TICKER[s.ticker];
  if(s.source==='crypto'||s.source==='kucoin') return 'Крипто';
  const txt=((s.sector||'')+' '+(s.company||'')).toLowerCase();
  if(/semicond|foundry|chip|gpu|\bai\b| artificial|полупровод/.test(txt)) return 'Полупроводники / AI';
  if(/defense|aerospace|military|defence|оборон|аэрокосм/.test(txt)) return 'Оборона / Аэрокосмос';
  if(/energy|\boil\b|\bgas\b|petro|энергет/.test(txt)) return 'Энергетика';
  if(/financ|bank|payment|insur|финанс/.test(txt)) return 'Финансы';
  if(/health|pharma|biotech|medical|здрав/.test(txt)) return 'Здравоохранение';
  if(/media|communicat|social|stream|медиа|комм/.test(txt)) return 'Медиа / Комм';
  if(/consumer|retail|auto|apparel|electronics|mega|потреб|мега/.test(txt)) return 'Потребительский';
  if(/industrial|manufactur|machin|промышлен/.test(txt)) return 'Промышленность';
  if(/крипт|crypto|bitcoin/.test(txt)) return 'Крипто';
  return 'Прочее';
}
function regionOf(s){
  const la=+s.lat, ln=+s.lng;
  if(la>=15&&la<=72&&ln>=-170&&ln<=-50) return 'Северная Америка';
  if(la>=-40&&la<=15&&ln>=-85&&ln<=-30) return 'Южная Америка';
  if(la>=35&&la<=72&&ln>=-25&&ln<=45) return 'Европа';
  if(la>=12&&la<=42&&ln>=34&&ln<=63) return 'Ближний Восток';
  if(la>=-12&&la<=72&&ln>=60&&ln<=155) return 'Азия';
  return 'Прочий мир';
}

function buildMenu(){
  const root=document.getElementById('menuTree');
  root.innerHTML=MENU.map(cat=>{
    const items=cat.sub.map(it=>{
      const dot=it.dot?`<span class="mi-dot" style="background:${it.dot}"></span>`:'';
      const tail = it.soon ? `<span class="mi-soon">СКОРО</span>`
                : it.type==='signals' ? `<span class="mi-cnt" id="cnt-${it.id}"></span>`
                : '';
      return `<div class="mitem ${activeView===it.id?'on':''}" id="mi-${it.id}" onclick="selectView('${it.id}')">${dot}<span>${it.label}</span>${tail}</div>`;
    }).join('');
    return `<div class="mcat ${cat.open?'open':''}" id="${cat.id}">
      <div class="mcat-h" onclick="toggleCat('${cat.id}')"><span class="ico">${cat.icon}</span><span>${cat.label}</span><span class="arr">▶</span></div>
      <div class="msub">${items}</div></div>`;
  }).join('');
}
function toggleCat(id){ document.getElementById(id).classList.toggle('open'); }
function toggleDrawer(force){
  const d=document.getElementById('drawer'), b=document.getElementById('burger'), s=document.getElementById('drawerScrim');
  const open = force===undefined ? !d.classList.contains('open') : force;
  d.classList.toggle('open',open); b.classList.toggle('open',open); s.classList.toggle('on',open);
}
function markActiveMenu(){
  document.querySelectorAll('.mitem').forEach(el=>el.classList.remove('on'));
  const el=document.getElementById('mi-'+activeView); if(el) el.classList.add('on');
}

/* Выбор пункта меню → переключение типа слоя */
function selectView(id){
  const it=findItem(id); if(!it) return;
  activeView=id; markActiveMenu();
  layerPlanes = (it.type==='planes');
  // муть верхних чипов для не-рыночных слоёв (чипы работают только для signals)
  document.getElementById('clusterbar').classList.toggle('muted', it.type!=='signals');

  if(it.type==='signals'){ active=null; renderChips(); }
  applyLayer(it);
  toggleDrawer(false);
}

/* applyLayer — единая точка: что рисуем по типу активного слоя */
function applyLayer(it){
  if(!world) return;
  if(it.type==='signals'){
    setFeedMode('signals'); render(); renderArcs(); rebuildHtml(); world.ringsData(currentRings());
  } else if(it.type==='zones'){
    setFeedMode('zones', it); renderZones(it); world.ringsData([]); renderArcs();
  } else if(it.type==='commodity'){
    setFeedMode('commodity', it); renderCommodity(it); world.ringsData([]); renderArcs();
  } else if(it.type==='planes'){
    setFeedMode('planes'); rebuildHtml(); pollPlanes(); world.ringsData([]); renderArcs();
  }
}
function activeItem(){ return findItem(activeView) || MENU[0].sub[0]; }

function init(){
  if(typeof Globe==='undefined'){fail('Не загрузился globe.gl. На Vercel загрузится.');return;}
  buildMenu();
  world=Globe()(document.getElementById('globe'))
    .backgroundColor('#03050b')
    .backgroundImageUrl('https://unpkg.com/three-globe/example/img/night-sky.png')
    .showAtmosphere(true).atmosphereColor('#1f8fff').atmosphereAltitude(0.25)
    .pointsData(allPoints()).pointLat('lat').pointLng('lng')
    .pointColor(d=>d.uni?'rgba(90,175,255,.92)':(COL[d.dir]||COL.neutral))
    .pointAltitude(d=>d.dir==='chain'?0.01:(d.uni?0.025:0.04+(d.score||0)/260))
    .pointRadius(d=>d.dir==='chain'?0.18:(d.uni?0.24:0.36)).pointResolution(14)
    .pointLabel(d=>`<div style="font-family:Inter;font-size:12px;color:#fff;background:rgba(8,12,20,.92);border:1px solid rgba(10,132,255,.4);border-radius:10px;padding:8px 11px"><b style="font-size:14px">${d.t}</b>${!d.uni&&d.dir!=='chain'?' · STARK '+d.score:''}<br><span style="color:#9aa3af">${d.sector||''}</span><br><span style="color:#5aafff;font-size:10px">клик → сводка</span></div>`)
    .onPointClick(d=>{ if(d.dir!=='chain'){ openPanelNode(d); world.controls().autoRotate=false; } })
    .arcStroke(d=>d.kind==='news'?0.45:0.55).arcDashGap(0.2).arcLabel('label')
    .arcDashLength(d=>d.kind==='news'?0.45:0.5).arcDashAnimateTime(d=>d.kind==='news'?1600:2600)
    .arcAltitude(d=>d.kind==='news'?0.18:0.28)
    .arcColor(d=> d.kind==='news' ? [`rgba(${hexRgb(COL[d.dir]||COL.neutral)},.05)`, COL[d.dir]||COL.neutral] : ['rgba(10,132,255,.05)','rgba(10,132,255,1)'])
    .htmlLat('lat').htmlLng('lng')
    .htmlAltitude(d=>d.kind==='label'?0.05+d.score/240:(d.kind==='plane'?0.05:0.025))
    .htmlElement(htmlEl)
    .labelsData([]).labelLat('lat').labelLng('lng').labelText('name')
    .labelSize(()=>labelK).labelDotRadius(0).labelColor(()=>'rgba(225,236,255,.82)').labelResolution(1).labelAltitude(0.008);

  fetch('https://unpkg.com/world-atlas@2/countries-110m.json').then(r=>r.json()).then(topo=>{
    countryFeats=topojson.feature(topo,topo.objects.countries).features;
    world.hexPolygonsData(countryFeats).hexPolygonResolution(3).hexPolygonMargin(0.4).hexPolygonUseDots(true)
      .hexPolygonColor(()=>'rgba(10,132,255,.16)').hexPolygonAltitude(0.003);
    world.polygonsData(countryFeats)
      .polygonCapColor(capColor)
      .polygonSideColor(()=>'rgba(10,132,255,.05)')
      .polygonStrokeColor(()=>'rgba(135,185,255,.45)')
      .polygonAltitude(f=>countryAgg[f.properties.name]?0.022:0.006);
    countryLabels=countryFeats.filter(f=>f.properties&&f.properties.name).map(f=>{const c=centroid(f.geometry);return {name:f.properties.name,lat:c[1],lng:c[0]};});
  }).catch(()=>world.globeImageUrl('https://unpkg.com/three-globe/example/img/earth-night.jpg'));

  world.controls().autoRotate=true; world.controls().autoRotateSpeed=0.3; world.controls().enableZoom=true;
  world.pointOfView({lat:34,lng:-110,altitude:2.4},0);
  setTimeout(()=>world.pointOfView({lat:28,lng:-30,altitude:2.6},4500),700);

  world.onZoom(pov=>{
    const show = pov.altitude < 1.7;
    if(show!==labelsShown){ labelsShown=show; world.labelsData(show?countryLabels:[]); }
    if(show) world.controls().autoRotate=false;
    const k=Math.max(0.4, Math.min(1.0, pov.altitude*0.55));
    if(Math.abs(k-labelK)>0.03){ labelK=k; if(labelsShown) world.labelSize(()=>labelK); }
  });

  document.getElementById('uniCount').textContent=UNIVERSE.length+NODES.length;
  window.addEventListener('resize',()=>world.width(innerWidth).height(innerHeight));
  setTimeout(()=>document.getElementById('boot').classList.add('gone'),900);
  buildTape(); rebuildHtml(); renderArcs(); loadUniverse();
  pollSignals(); setInterval(pollSignals, POLL_MS);
  setInterval(()=>{ if(layerPlanes) pollPlanes(); }, PLANE_MS);
}
function allPoints(){ return [...NODES, ...UNIVERSE, ...CHAIN_NODES.map(n=>({...n,dir:'chain',score:0,sector:'Supply node'}))]; }
function fail(msg){const b=document.getElementById('boot');b.textContent=msg;b.style.letterSpacing='normal';b.style.fontWeight='500';b.style.color='#9aa3af';b.style.padding='30px';b.style.textAlign='center';}
function centroid(geom){let x=0,y=0,n=0;const walk=c=>{if(typeof c[0]==='number'){x+=c[0];y+=c[1];n++;}else c.forEach(walk);};walk(geom.coordinates);return[x/n,y/n];}

/* ════ ЗАГРУЗКА ВСЕЛЕННОЙ ИЗ БЭКЕНДА ════ */
async function loadUniverse(){
  try{
    const r=await fetch(UNIVERSE_API);
    if(!r.ok) throw new Error('HTTP '+r.status);
    const j=await r.json();
    const pts=Array.isArray(j.points)?j.points:[];
    const inNodes=new Set(NODES.map(n=>n.t));
    UNIVERSE = pts
      .filter(p=>p&&p.ticker&&p.hq_lat!=null&&p.hq_lng!=null&&!inNodes.has(p.ticker))
      .map(p=>({
        t:p.ticker,
        name:p.city?`${p.ticker} · ${p.city}`:p.ticker,
        lat:+p.hq_lat, lng:+p.hq_lng,
        sector:normSector(p.sector),
        country:p.country||null,
        dir:'neutral', uni:true
      }));
    rebuildByT(); rebuildSectorMap();
    if(world && activeItem().type==='signals'){ world.pointsData(allPoints()); rebuildHtml(); }
    document.getElementById('uniCount').textContent=UNIVERSE.length+NODES.length;
    console.log(`[STARK] вселенная: ${UNIVERSE.length} имён (+${NODES.length} hero) из ${j.count} разрешённых`);
  }catch(e){
    console.warn('[STARK] /api/universe-geo недоступен — рисую только hero-узлы:',e.message);
    document.getElementById('uniCount').textContent=NODES.length;
  }
}

/* ════════ CHOROPLETH ════════ */
function capColor(f){
  const a=countryAgg[f.properties.name];
  if(!a) return 'rgba(0,0,0,0)';
  const intensity=Math.min(1, a.total/130)*0.5+0.14;
  if(a.net>2)  return `rgba(48,209,88,${intensity})`;
  if(a.net<-2) return `rgba(255,69,58,${intensity})`;
  return `rgba(138,144,153,${intensity*0.8})`;
}
function recomputeAgg(){
  countryAgg={};
  liveSignals.forEach(s=>{
    const nm=geoName(s.country); if(!nm) return;
    const sign=s.direction==='bull'?1:s.direction==='bear'?-1:0;
    const imp=+s.impact||0;
    (countryAgg[nm]=countryAgg[nm]||{net:0,total:0,count:0});
    countryAgg[nm].net+=sign*imp; countryAgg[nm].total+=imp; countryAgg[nm].count++;
  });
}

/* ════════ HTML-СЛОЙ ════════ */
function htmlEl(d){
  if(d.kind==='conflict'){
    const el=document.createElement('div'); el.className='conflict-mark';
    el.innerHTML=`<div class="pin"></div><div class="nm">${d.name}</div>`;
    el.onclick=()=>openPanelZone(d.idx); return el;
  }
  if(d.kind==='commodity'){
    const el=document.createElement('div'); el.className='commo-mark';
    const sz=Math.max(9, Math.min(22, d.size||12));
    el.innerHTML=`<div class="dot" style="width:${sz}px;height:${sz}px;background:${d.color};color:${d.color}"></div><div class="nm" style="color:${d.color}">${d.country} ${d.vol}</div>`;
    el.onclick=()=>openPanelCommodity(d.cmKey, d.i); return el;
  }
  if(d.kind==='plane'){
    const el=document.createElement('div'); el.className='plane-mark';
    el.style.transform=`translate(-50%,-50%) rotate(${d.track||0}deg)`;
    el.title=`${d.callsign} ${d.type||''}`.trim(); el.textContent='✈'; return el;
  }
  if(d.kind==='uniLabel'){
    const el=document.createElement('div'); el.className='uni-lbl'; el.textContent=d.t; return el;
  }
  const el=document.createElement('div'); el.className='floatlab';
  el.innerHTML=`<span style="color:${COL[d.dir]}">${d.t}</span><span class="s" style="color:#9aa3af">${d.score}</span>`;
  return el;
}

/* rebuildHtml зависит от активного типа слоя */
function rebuildHtml(){
  if(!world) return;
  const it=activeItem();
  let arr=[];
  if(it.type==='signals'){
    arr=arr.concat(NODES.filter(n=>n.score>=72).map(n=>({...n,kind:'label'})));
  }
  if(it.type==='zones'){
    const zones=ZONE_SETS[it.data]||[];
    arr=arr.concat(zones.map((z,i)=>({...z,idx:i,kind:'conflict'})));
  }
  if(it.type==='commodity'){
    const cm=COMMODITIES[it.data];
    if(cm) arr=arr.concat(cm.sources.map((s,i)=>({
      lat:s.lat,lng:s.lng,kind:'commodity',country:s.country,vol:s.vol,
      color:cm.color,cmKey:it.data,i,size:10+i*0  // размер можно завязать на vol позже
    })));
  }
  if(it.type==='planes' || layerPlanes){ arr=arr.concat(planes); }
  world.htmlElementsData(arr);
}

/* ════════ ДУГИ ════════ */
function renderArcs(){
  if(!world) return;
  const it=activeItem();
  let arr=[];
  // цепочки и новостные дуги только в рыночном слое
  if(it.type==='signals'){
    arr=arr.concat(supplyArcs);
    const data=active===null?liveSignals:liveSignals.filter(s=>clusterOf(s)===active);
    const news=[];
    data.forEach(s=>{
      const node = byT[s.ticker] || (s.hq_lat!=null?{lat:+s.hq_lat,lng:+s.hq_lng}:null);
      if(!node||s.lat==null) return;
      news.push({startLat:+s.lat,startLng:+s.lng,endLat:node.lat,endLng:node.lng,dir:s.direction,kind:'news',label:`${s.ticker} ← ${esc(s.headline||'')}`});
    });
    arr=arr.concat(news.slice(0,28));
  }
  world.arcsData(arr);
}
function currentRings(){
  const data = active===null?liveSignals:liveSignals.filter(s=>clusterOf(s)===active);
  return data.filter(s=>s.lat!=null&&s.lng!=null).map(s=>{
    const imp=+s.impact||0, hot=imp>=70;
    return {lat:+s.lat,lng:+s.lng,col:COL[s.direction]||COL.neutral,speed:hot?2.2:1.0+imp/70,max:hot?4.2:2.0+imp/35,period:hot?1100:1700};
  });
}

/* ════════ ВОЕННЫЕ БОРТЫ ════════ */
async function pollPlanes(){
  if(!layerPlanes && activeItem().type!=='planes') return;
  try{
    const r=await fetch(PLANE_URL,{headers:{'Accept':'application/json'}});
    if(!r.ok) throw new Error('HTTP '+r.status);
    const j=await r.json(); const ac=j.ac||j.aircraft||[];
    planes=ac.filter(a=>a.lat!=null&&(a.lon!=null||a.lng!=null)).slice(0,120).map(a=>({
      kind:'plane', lat:+a.lat, lng:+(a.lon!=null?a.lon:a.lng),
      callsign:String(a.flight||a.r||'MIL').trim(), type:a.t||'', track:+a.track||0 }));
  }catch(e){ planes=[]; }
  rebuildHtml();
}

/* ════ АДАПТЕР: контракт globe-scan → плоские сигналы ════ */
function flattenSignals(rows){
  const out=[];
  (rows||[]).forEach(row=>{
    if(Array.isArray(row.targets) && row.targets.length){
      row.targets.forEach(tg=>{
        const imp01=+tg.impact_score||0;
        out.push({
          ticker: tg.ticker, company: tg.name||row.headline, headline: row.headline,
          url: row.url, created_at: row.created_at, country: row.origin_country,
          lat: row.origin_lat, lng: row.origin_lng, hq_lat: tg.hq_lat, hq_lng: tg.hq_lng,
          impact: Math.round(Math.abs(imp01)*100),
          direction: imp01>0.05?'bull':imp01<-0.05?'bear':'neutral',
          sector: row.sector, chain: tg.chain, confidence: tg.confidence,
          bull_case_counter: row.bull_case_counter, second_order: row.second_order,
          event_id: row.event_id
        });
      });
    } else { out.push(row); }
  });
  return out;
}

/* ════════ LIVE СИГНАЛЫ (с автоподсветкой свежих) ════════ */
async function pollSignals(){
  try{
    const r=await fetch(`${SUPA_URL}/rest/v1/signals?select=*&order=created_at.desc&limit=120`,{headers:{apikey:SUPA_KEY,Authorization:'Bearer '+SUPA_KEY}});
    if(!r.ok) throw new Error('HTTP '+r.status);
    const rows=await r.json();
    const flat=flattenSignals(Array.isArray(rows)?rows:[]);

    // вычисляем свежие event_id (появились в этом опросе, не в первом)
    const incoming=new Set(flat.map(s=>s.event_id).filter(Boolean));
    if(!firstSignalLoad){
      flat.forEach(s=>{ if(s.event_id && !seenEventIds.has(s.event_id)) s._fresh=true; });
    }
    incoming.forEach(id=>seenEventIds.add(id));
    firstSignalLoad=false;

    liveSignals=flat;
    const now=new Date().toLocaleTimeString('ru-RU',{hour:'2-digit',minute:'2-digit'});
    document.getElementById('updTime').textContent=now; document.getElementById('feedUpd').textContent=now;
    document.getElementById('sigCount').textContent=liveSignals.length;
    recomputeAgg(); renderChoropleth(); renderChips(); updateMenuCounts();

    // обновляем шар только если активен рыночный слой
    if(activeItem().type==='signals'){ render(); renderArcs(); world.ringsData(currentRings()); }
  }catch(e){ if(!liveSignals.length && activeItem().type==='signals') document.getElementById('feedList').innerHTML=`<div class="feed-empty">Поток недоступен.<br><span style="font-size:10px">${e.message}</span></div>`; }
}
function renderChoropleth(){ if(!world||!countryFeats.length) return; world.polygonCapColor(capColor).polygonAltitude(f=>countryAgg[f.properties.name]?0.022:0.006); }
function updateMenuCounts(){ const el=document.getElementById('cnt-market-all'); if(el) el.textContent=liveSignals.length; }

function clusterOf(s){ return mode==='sector'?sectorOf(s):regionOf(s); }
function renderChips(){
  const counts={};
  liveSignals.forEach(s=>{const c=clusterOf(s);counts[c]=(counts[c]||0)+1;});
  const order=Object.keys(counts).sort((a,b)=>counts[b]-counts[a]);
  const chips=document.getElementById('chips');
  let html=`<div class="chip ${active===null?'on':''}" onclick="pick(null)">Все <span class="cnt">${liveSignals.length}</span></div>`;
  html+=order.map(c=>`<div class="chip ${active===c?'on':''}" onclick="pick('${c.replace(/'/g,"\\'")}')">${c} <span class="cnt">${counts[c]}</span></div>`).join('');
  chips.innerHTML=html;
}
function pick(c){
  if(activeItem().type!=='signals') return;   // чипы работают только в рыночном слое
  active=c; renderChips(); render(); renderArcs(); world.ringsData(currentRings());
  if(c){
    const subset=liveSignals.filter(s=>clusterOf(s)===c).filter(s=>s.lat!=null);
    let center;
    if(mode==='region'&&REGION_CENTER[c]) center=REGION_CENTER[c];
    else if(subset.length){ const la=subset.reduce((a,s)=>a+ +s.lat,0)/subset.length, ln=subset.reduce((a,s)=>a+ +s.lng,0)/subset.length; center=[la,ln]; }
    if(center){ world.controls().autoRotate=false; world.pointOfView({lat:center[0],lng:center[1],altitude:1.9},1000); }
  }
}
function setMode(m){
  mode=m; active=null;
  document.getElementById('modeSector').classList.toggle('on',m==='sector');
  document.getElementById('modeRegion').classList.toggle('on',m==='region');
  if(activeItem().type==='signals'){ renderChips(); render(); renderArcs(); }
}

/* ════════ ЛЕНТА (по режимам) ════════ */
function setFeedMode(kind, it){
  const titleEl=document.getElementById('feedTitle');
  if(kind==='signals'){ titleEl.textContent = active===null?'ВЕСЬ РЫНОК':active.toUpperCase(); }
  else if(kind==='zones'){ titleEl.textContent='ЗОНЫ РИСКА'; }
  else if(kind==='commodity'){ const cm=COMMODITIES[it.data]; titleEl.textContent=(it.label||'СЫРЬЁ').toUpperCase(); }
  else if(kind==='planes'){ titleEl.textContent='ВОЕННЫЕ БОРТЫ'; }
}
function render(){
  if(activeItem().type!=='signals') return;
  const data = active===null?liveSignals:liveSignals.filter(s=>clusterOf(s)===active);
  document.getElementById('feedTitle').textContent = active===null?'ВЕСЬ РЫНОК':active.toUpperCase();
  const list=document.getElementById('feedList');
  if(!data.length){ list.innerHTML='<div class="feed-empty">Нет сигналов в этом кластере.</div>'; return; }
  list.innerHTML=data.slice(0,50).map(s=>{
    const c=COL[s.direction]||COL.neutral, dir={bull:'BULL',bear:'BEAR',neutral:'НЕЙТР'}[s.direction]||'—';
    const when=s.created_at?new Date(s.created_at).toLocaleTimeString('ru-RU',{hour:'2-digit',minute:'2-digit'}):'';
    const payload=encodeURIComponent(JSON.stringify(s));
    return `<div class="sigcard ${s._fresh?'fresh':''}" onclick="openPanelSignal('${payload}')"><div class="top"><span class="tk">${esc(s.ticker||'—')}</span><span class="dir" style="background:${c}22;color:${c}">${dir}</span><span class="imp">${s.impact??''}</span></div><div class="hl">${esc(s.headline||s.company||'')}</div><div class="meta">${esc(clusterOf(s))}${when?' · '+when:''}</div></div>`;
  }).join('');
}

/* Рендер слоя ЗОН */
function renderZones(it){
  rebuildHtml();
  const zones=ZONE_SETS[it.data]||[];
  const list=document.getElementById('feedList');
  list.innerHTML = zones.length ? zones.map((z,i)=>
    `<div class="sigcard" onclick="openPanelZone(${i})"><div class="top"><span class="tk" style="font-size:12px;color:var(--warn)">⚠ ${esc(z.name)}</span></div><div class="hl">${esc(z.note)}</div><div class="meta">${z.tickers.join(' · ')}</div></div>`
  ).join('') : '<div class="feed-empty">Зоны не заданы.</div>';
  if(zones[0]) world.pointOfView({lat:zones[0].lat,lng:zones[0].lng,altitude:2.0},1000);
}

/* Рендер слоя СЫРЬЯ */
function renderCommodity(it){
  rebuildHtml();
  const cm=COMMODITIES[it.data];
  const list=document.getElementById('feedList');
  if(!cm){
    list.innerHTML=`<div class="soon-note"><b>${esc(it.label)}</b> — слой готов, данные подключим следующим ходом.<br><br>Структура уже на месте: добавляем страны-добытчики с объёмами в COMMODITIES['${it.data}'] — и они сразу появятся на карте и в этой ленте.</div>`;
    return;
  }
  list.innerHTML = `<div style="font-size:10px;color:var(--dim);margin-bottom:10px;line-height:1.5">${esc(cm.note||'')}</div>` +
    cm.sources.map((s,i)=>
      `<div class="commocard" onclick="openPanelCommodity('${it.data}',${i})"><div class="top"><span class="rk" style="color:${cm.color}">#${i+1}</span><span class="ct">${esc(s.country)}</span><span class="vol">${esc(s.vol)} ${esc(cm.unit)}</span></div><div class="share">доля рынка ${esc(s.share||'—')}</div></div>`
    ).join('');
  if(cm.sources[0]) world.pointOfView({lat:30,lng:20,altitude:2.4},1000);
}

/* ════════ LIVE STARK-АНАЛИЗ ════════ */
// Блок с кнопкой-триггером (НЕ автозапуск — /api/analyze дёргается только по клику)
function analysisBlock(ticker){
  const t=String(ticker||'').replace(/'/g,'');
  return `<div class="sec-t">STARK · live-анализ</div>
    <div id="liveAnalysis"><button class="ana-btn" onclick="loadAnalysis('${esc(t)}')">▶ Запустить анализ ${esc(t)}</button></div>`;
}
async function loadAnalysis(ticker){
  const box=document.getElementById('liveAnalysis'); if(!box) return;
  box.innerHTML=`<div class="spin"></div><div class="loadmsg">STARK анализирует ${esc(ticker)}…<br>Tavily + Claude, ~10–30 сек</div>`;
  try{
    const r=await fetch(ANALYZE_URL,{method:'POST',headers:{'Content-Type':'application/json'},body:JSON.stringify({ticker, action:'analyze'})});
    if(!r.ok) throw new Error('HTTP '+r.status);
    const data=await r.json();
    box.innerHTML=renderAnalysis(data)+`<button class="ana-btn" style="margin-top:10px;font-size:11px;padding:9px;opacity:.7" onclick="loadAnalysis('${esc(String(ticker).replace(/'/g,''))}')">↻ Обновить</button>`;
  }catch(e){
    box.innerHTML=`<div class="warn-note"><b>Live-анализ не загрузился</b> (${esc(e.message)}).</div><button class="ana-btn" style="margin-top:10px;font-size:12px;padding:10px" onclick="loadAnalysis('${esc(String(ticker).replace(/'/g,''))}')">↻ Повторить</button>`;
  }
}
function renderInsiders(ins){
  const E=esc;
  const card=(txt,buy)=>`<div class="p-hl" style="border-color:${buy?'rgba(48,209,88,.45)':'rgba(255,69,58,.45)'};background:${buy?'rgba(48,209,88,.08)':'rgba(255,69,58,.08)'}"><span style="font-weight:800;color:${buy?'var(--bull)':'var(--bear)'}">${buy?'▲ ПОКУПКА':'▼ ПРОДАЖА'}</span> · ${E(txt)}</div>`;
  const guessBuy=t=>{const s=String(t).toLowerCase();if(/прода|sell|sold|sale|dispos/.test(s))return false;if(/куп|buy|bought|acqui|purchase/.test(s))return true;return null;};
  if(typeof ins==='string'){const b=guessBuy(ins);return b===null?`<div class="p-hl">${E(ins)}</div>`:card(ins,b);}
  if(Array.isArray(ins)){
    if(!ins.length) return `<div class="p-hl" style="color:var(--dim)">Сделок инсайдеров не найдено.</div>`;
    return ins.slice(0,12).map(it=>{
      if(typeof it==='string'){const b=guessBuy(it);return b===null?`<div class="p-hl">${E(it)}</div>`:card(it,b);}
      const who=it.name||it.insider||it.who||'', role=it.role||it.title||'', type=it.type||it.action||it.transaction||'';
      const sh=it.shares||it.qty||it.amount||'', px=it.price||it.priceRange||'', date=it.date||'';
      const b=it.buy===true?true:(it.buy===false?false:guessBuy(type||''));
      const line=[who&&role?`${who} (${role})`:(who||role), type, sh&&`${sh} акц.`, px&&`@ ${px}`, date].filter(Boolean).join(' · ');
      return b===null?`<div class="p-hl">${E(line)}</div>`:card(line,b);
    }).join('');
  }
  return `<div class="p-hl" style="white-space:pre-wrap;font-size:11px">${E(JSON.stringify(ins,null,2)).slice(0,1200)}</div>`;
}
function renderAnalysis(d){
  if(!d) return '<div class="warn-note">Пустой ответ.</div>';
  if(typeof d==='string') return `<div class="p-hl" style="white-space:pre-wrap">${esc(d).slice(0,3000)}</div>`;
  const E=esc, P=[], has=v=>v!==undefined&&v!==null&&v!=='';
  const pick=(...keys)=>{for(const k of keys){if(has(d[k]))return d[k];}return undefined;};

  // ── Цена / шапка ──
  let priceStr=pick('price'); if(!has(priceStr)&&has(d.priceNum)) priceStr=`${d.priceNum} ${d.currency||''}`.trim();
  if(has(priceStr)) P.push(`<div class="ana-price"><span class="px">${E(priceStr)}</span>${has(d.companyName)?`<span class="cn">${E(d.companyName)}</span>`:''}</div>`);

  // ── Метрики ──
  const rows=[]; const cap=pick('marketCap'); if(has(cap))rows.push(['Кап.',cap]);
  const pe=pick('peRatio','pe'); if(has(pe))rows.push(['P/E',pe]);
  const dv=pick('dividend'); if(has(dv))rows.push(['Дивиденд',dv]);
  if(rows.length) P.push(rows.map(([k,v])=>`<div class="sig"><span class="k">${E(k)}</span><span class="v">${E(v)}</span></div>`).join(''));

  // ── 52-нед диапазон ──
  const hi=pick('week52High'), lo=pick('week52Low');
  if(has(hi)||has(lo)){
    let atHigh=null; if(has(d.atHigh)) atHigh=typeof d.atHigh==='number'?d.atHigh:parseFloat(String(d.atHigh).replace('%',''));
    const hN=d.week52HighNum, lN=d.week52LowNum, pN=d.priceNum; let bar;
    if([hN,lN,pN].every(x=>typeof x==='number'&&isFinite(x))&&hN>lN){
      const pos=Math.max(0,Math.min(100,((pN-lN)/(hN-lN))*100));
      const col=pos>85?'var(--bear)':pos<20?'var(--bull)':'var(--blue)';
      bar=`<div class="rngbar"><div class="rngfill" style="width:${pos.toFixed(0)}%;background:${col}"></div><div class="rngdot" style="left:${pos.toFixed(0)}%"></div></div><div class="rnglab"><span>${E(lo)}</span><span style="color:${col};font-weight:800">${pos.toFixed(0)}% диапазона</span><span>${E(hi)}</span></div>`;
    } else bar=`<div class="sig"><span class="k">52-нед</span><span class="v">${E(lo)} — ${E(hi)}</span></div>`;
    const flag=(atHigh!=null&&isFinite(atHigh)&&atHigh>=90)?' · <span style="color:var(--bear)">у максимума</span>':'';
    P.push(`<div class="sec-t">52-нед диапазон${flag}</div>${bar}`);
  }

  // ── Аналитики ──
  const cons=pick('analystConsensus'), atxt=pick('analystText');
  if(has(cons)||has(atxt)){
    P.push(`<div class="sec-t">Консенсус аналитиков</div>`);
    if(has(cons)) P.push(`<div class="sig"><span class="k">Рейтинг</span><span class="v" style="color:var(--blue)">${E(cons)}</span></div>`);
    if(has(atxt)) P.push(`<div class="p-hl">${E(atxt)}</div>`);
  }

  // ── ИНСАЙДЕРЫ (приоритетный сигнал Алексея) ──
  const ins=pick('insiders','Инсайдеры','insiderActivity','insiderTrades','insider','insiderBuys','insiderSelling');
  if(has(ins)){ P.push(`<div class="sec-t">⚑ Инсайдеры / мажоритарии</div>`); P.push(renderInsiders(ins)); }

  // ── СОБЫТИЯ ──
  const ev=pick('События','events','Events','catalysts','calendar');
  if(Array.isArray(ev)&&ev.length){
    P.push(`<div class="sec-t">События / катализаторы</div>`);
    P.push(ev.slice(0,10).map(e=>{
      if(typeof e==='string') return `<div class="p-hl">${E(e)}</div>`;
      const urg=e.urgent===true||/срочно|urgent|true/i.test(String(e.urgent||''));
      const date=has(e.date)?`<b style="font-family:var(--mono);color:${urg?'var(--bear)':'var(--blue)'}">${E(e.date)}</b> · `:'';
      return `<div class="p-hl" style="${urg?'border-color:rgba(255,69,58,.4);background:rgba(255,69,58,.07)':''}">${date}${E(e.event||e.title||e.text||'')}</div>`;
    }).join(''));
  } else if(has(ev)&&typeof ev==='string') P.push(`<div class="sec-t">События</div><div class="p-hl" style="white-space:pre-wrap">${E(ev)}</div>`);

  // ── Тезисы / свободный текст ──
  const thesis=pick('thesis','тезис'); if(has(thesis)) P.push(`<div class="sec-t">Тезис</div><div class="p-hl">${E(thesis)}</div>`);
  const bull=pick('bull','bull_case'); if(has(bull)) P.push(`<div class="sec-t">Бык</div><div class="p-hl" style="border-color:rgba(48,209,88,.3)">${E(bull)}</div>`);
  const bear=pick('bear','bear_case'); if(has(bear)) P.push(`<div class="sec-t">Медведь</div><div class="p-hl" style="border-color:rgba(255,69,58,.3)">${E(bear)}</div>`);
  const note=pick('analysis','text','summary','result'); if(has(note)) P.push(`<div class="sec-t">Заметка STARK</div><div class="p-hl" style="white-space:pre-wrap">${E(typeof note==='string'?note:JSON.stringify(note)).slice(0,2500)}</div>`);

  if(P.length) return P.join('');
  return `<div class="p-hl" style="white-space:pre-wrap;font-size:11px">${E(JSON.stringify(d,null,2)).slice(0,1800)}</div>`;
}

/* ════════ ПАНЕЛИ ════════ */
function ring(score,col){const c=2*Math.PI*42,off=c*(1-score/100);return`<svg width="92" height="92" viewBox="0 0 100 100"><circle cx="50" cy="50" r="42" fill="none" stroke="rgba(255,255,255,.08)" stroke-width="8"/><circle cx="50" cy="50" r="42" fill="none" stroke="${col}" stroke-width="8" stroke-linecap="round" stroke-dasharray="${c}" stroke-dashoffset="${off}" transform="rotate(-90 50 50)"/></svg>`;}
const SIG=[['scThesis','Тезис','25%'],['scAntic','Предвосхищение','25%'],['scInsider','Инсайдеры','15%'],['scMom','Моментум','15%'],['scRR','R:R','10%'],['scSent','Сентимент','10%']];
function chainsFor(t){return ARCS.filter(a=>a.from===t||a.to===t).map(a=>`<div class="lnk"><b>${a.from}</b><span class="arr">→</span><b>${a.to}</b></div><div style="font-size:11px;color:var(--dim);margin:-2px 0 4px 2px">${a.label}</div>`).join('');}
function openPanelNode(d){
  if(d.uni){ openPanelUniverse(d); return; }
  const col=COL[d.dir],badge={bull:'BULL',bear:'BEAR',neutral:'НЕЙТРАЛ'}[d.dir];
  const chains=chainsFor(d.t)||'<div style="font-size:12px;color:var(--dim)">прямых лид-зависимостей нет</div>';
  document.getElementById('panelBody').innerHTML=`
    <div class="p-tick"><h2>${d.t}</h2><span class="p-badge" style="background:${col}22;color:${col}">${badge}</span></div>
    <div class="p-name">${d.name}</div>
    <div class="ring-wrap"><div style="position:relative">${ring(d.score,col)}<div style="position:absolute;inset:0;display:flex;align-items:center;justify-content:center;font-family:var(--mono);font-weight:900;font-size:22px">${d.score}</div></div>
    <div class="val"><span class="big" style="color:${col}">${d.score}</span><span class="lab">STARK SCORE · посев</span></div></div>
    <div class="geo">📍 ${d.lat.toFixed(2)}, ${d.lng.toFixed(2)} · ${d.sector}</div>
    <div class="sec-t">Сигналы (посев)</div>
    ${SIG.map(([k,l,w])=>`<div class="sig"><span class="k">${l} <span style="opacity:.5">${w}</span></span><span class="v" style="color:${d[k]>=70?'var(--bull)':d[k]<50?'var(--bear)':'var(--text)'}">${d[k]??'—'}</span></div>`).join('')}
    ${analysisBlock(d.t)}
    <div class="sec-t">Цепочки поставок / лиды</div><div class="chain">${chains}</div>`;
  document.getElementById('panel').classList.add('open'); flyTo(d.lat,d.lng);
}
function openPanelUniverse(d){
  const news=liveSignals.filter(s=>s.ticker===d.t), chains=chainsFor(d.t);
  document.getElementById('panelBody').innerHTML=`
    <div class="p-tick"><h2>${d.t}</h2><span class="p-badge" style="background:rgba(90,175,255,.18);color:#8fc4ff">ВСЕЛЕННАЯ</span></div>
    <div class="p-name">${d.name}</div>
    <div class="geo">📍 ${d.lat.toFixed(2)}, ${d.lng.toFixed(2)} · ${d.sector}</div>
    ${analysisBlock(d.t)}
    ${news.length?`<div class="sec-t">Свежие сигналы (${news.length})</div>`+news.slice(0,4).map(s=>`<div class="p-hl">${esc(s.headline||'')}</div>`).join(''):''}
    ${chains?`<div class="sec-t">Цепочки поставок / лиды</div><div class="chain">${chains}</div>`:''}`;
  document.getElementById('panel').classList.add('open'); flyTo(d.lat,d.lng);
}
function openPanelSignal(payload){
  let s; try{ s=JSON.parse(decodeURIComponent(payload)); }catch(e){ return; }
  const col=COL[s.direction]||COL.neutral, badge={bull:'BULL',bear:'BEAR',neutral:'НЕЙТРАЛ'}[s.direction]||'—', imp=s.impact??0;
  const chains = byT[s.ticker] ? chainsFor(s.ticker) : '';
  const when=s.created_at?new Date(s.created_at).toLocaleString('ru-RU',{day:'2-digit',month:'2-digit',hour:'2-digit',minute:'2-digit'}):'';
  document.getElementById('panelBody').innerHTML=`
    <div class="p-tick"><h2>${esc(s.ticker||'—')}</h2><span class="p-badge" style="background:${col}22;color:${col}">${badge}</span></div>
    <div class="p-name">${esc(s.company||clusterOf(s))}</div>
    <div class="ring-wrap"><div style="position:relative">${ring(imp,col)}<div style="position:absolute;inset:0;display:flex;align-items:center;justify-content:center;font-family:var(--mono);font-weight:900;font-size:22px">${imp}</div></div>
    <div class="val"><span class="big" style="color:${col}">${imp}</span><span class="lab">IMPACT</span></div></div>
    <div class="geo">📍 ${s.lat!=null?(+s.lat).toFixed(2)+', '+(+s.lng).toFixed(2):'—'} · ${esc(s.country||clusterOf(s))}</div>
    <div class="sec-t">Событие</div><div class="p-hl">${esc(s.headline||'—')}</div>
    ${s.url?`<a href="${esc(s.url)}" target="_blank" style="font-size:11px;color:var(--blue);font-weight:700;text-decoration:none">Источник ↗</a>`:''}
    ${s.chain?`<div class="sec-t">Цепочка причинности</div><div class="p-hl">${esc(s.chain)}</div>`:''}
    ${s.bull_case_counter?`<div class="sec-t">Контртезис (bull case)</div><div class="p-hl" style="border-color:rgba(48,209,88,.3)">${esc(s.bull_case_counter)}</div>`:''}
    <div class="sig"><span class="k">Сектор</span><span class="v" style="font-size:11px">${esc(clusterOf(s))}</span></div>
    <div class="sig"><span class="k">Направление</span><span class="v" style="color:${col}">${badge}</span></div>
    ${s.confidence!=null?`<div class="sig"><span class="k">Уверенность</span><span class="v">${Math.round((+s.confidence)*100)}%</span></div>`:''}
    <div class="sig"><span class="k">Время</span><span class="v" style="font-size:11px">${when||'—'}</span></div>
    ${s.ticker?analysisBlock(s.ticker):''}
    ${chains?`<div class="sec-t">Цепочки поставок / лиды</div><div class="chain">${chains}</div>`:''}`;
  document.getElementById('panel').classList.add('open'); if(s.lat!=null) flyTo(+s.lat,+s.lng);
}
function openPanelZone(idx){
  const zones=ZONE_SETS[activeItem().data]||[]; const z=zones[idx]; if(!z) return;
  const chips=z.tickers.map(t=>`<span class="tk-chip">${t}</span>`).join('');
  document.getElementById('panelBody').innerHTML=`
    <div class="p-tick"><h2 style="font-size:22px">${esc(z.name)}</h2><span class="p-badge" style="background:rgba(255,159,10,.18);color:var(--warn)">ЗОНА РИСКА</span></div>
    <div class="p-name">📍 ${z.lat.toFixed(2)}, ${z.lng.toFixed(2)}</div>
    <div class="sec-t">Тикеры под влиянием</div><div style="margin-bottom:6px">${chips}</div>
    <div class="sec-t">Рыночное эхо</div><div class="p-hl">${esc(z.note)}</div>
    <div class="warn-note"><b>Статичная зона риска.</b> Карта связей «катализатор → сектор». Точные live-данные о боях подключим отдельным слоем.</div>`;
  document.getElementById('panel').classList.add('open'); flyTo(z.lat,z.lng);
}
function openPanelCommodity(cmKey, i){
  const cm=COMMODITIES[cmKey]; if(!cm) return; const s=cm.sources[i]; if(!s) return;
  document.getElementById('panelBody').innerHTML=`
    <div class="p-tick"><h2 style="font-size:22px">${esc(s.country)}</h2><span class="p-badge" style="background:${cm.color}22;color:${cm.color}">ДОБЫЧА</span></div>
    <div class="p-name">📍 ${s.lat.toFixed(2)}, ${s.lng.toFixed(2)}</div>
    <div class="sec-t">Объём</div><div class="p-hl"><b style="font-family:var(--mono);font-size:20px;color:${cm.color}">${esc(s.vol)}</b> ${esc(cm.unit)}</div>
    <div class="sig"><span class="k">Доля мирового рынка</span><span class="v">${esc(s.share||'—')}</span></div>
    <div class="sig"><span class="k">Ранг</span><span class="v">#${i+1}</span></div>
    <div class="soon-note">${esc(cm.note||'')}<br><br>Следующим ходом подключим: связь с тикерами-производителями, динамику цены, новостные дуги по этому товару.</div>`;
  document.getElementById('panel').classList.add('open'); flyTo(s.lat,s.lng);
}
function closePanel(){document.getElementById('panel').classList.remove('open');if(world)world.controls().autoRotate=true;}
function flyTo(lat,lng){if(world&&lat!=null){world.controls().autoRotate=false;world.pointOfView({lat,lng,altitude:1.5},1000);}}
function esc(s){return String(s).replace(/[&<>"]/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;'}[c]));}

function buildTape(){const t=CRYPTO.map(c=>`<span class="tchip"><span class="t">${c.t}</span><span class="px">${c.px}</span><span class="trg">${c.trg}</span></span>`).join('');document.getElementById('tapeTrack').innerHTML=t+t;}

init();
</script>
