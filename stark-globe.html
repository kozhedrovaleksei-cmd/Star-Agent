<!DOCTYPE html>
<html lang="ru">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>STARK · ГЛОБУС</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700;800;900&display=swap" rel="stylesheet">
<script src="https://unpkg.com/globe.gl"></script>
<script src="https://unpkg.com/topojson-client@3"></script>
<style>
  :root{
    --bg:#03050b; --glass:rgba(14,18,28,.66);
    --line:rgba(255,255,255,.08);
    --blue:#0a84ff; --blue-soft:rgba(10,132,255,.16);
    --bull:#30d158; --bear:#ff453a; --neutral:#8a9099;
    --text:#f5f7fa; --dim:#9aa3af; --r:18px;
    --mono:'Inter',ui-monospace,'SF Mono',Menlo,monospace;
  }
  *{box-sizing:border-box;margin:0;padding:0}
  html,body{height:100%;background:#03050b;color:var(--text);font-family:'Inter',-apple-system,sans-serif;overflow:hidden}
  #globe{position:fixed;inset:0;z-index:1}
  #globe canvas{display:block}
  .vignette{position:fixed;inset:0;z-index:2;pointer-events:none;
    background:radial-gradient(120% 120% at 50% 45%,transparent 52%,rgba(3,5,11,.55) 82%,rgba(3,5,11,.92) 100%)}

  .floatlab{transform:translate(-50%,-50%);pointer-events:none;white-space:nowrap;display:flex;align-items:center;gap:6px;
    font-family:var(--mono);font-size:11px;font-weight:800;background:rgba(8,12,20,.72);border:1px solid rgba(10,132,255,.45);
    border-radius:9px;padding:4px 8px;box-shadow:0 0 16px rgba(10,132,255,.35);backdrop-filter:blur(4px)}
  .floatlab .s{font-size:10px;font-weight:700}

  header{position:fixed;top:0;left:0;right:0;z-index:10;display:flex;align-items:center;justify-content:space-between;
    padding:14px 22px;background:linear-gradient(180deg,rgba(3,5,11,.9),transparent);backdrop-filter:blur(14px)}
  .brand{display:flex;align-items:center;gap:12px}
  .brand .dot{width:9px;height:9px;border-radius:50%;background:var(--blue);box-shadow:0 0 16px var(--blue);animation:beat 2.4s ease-in-out infinite}
  @keyframes beat{0%,100%{opacity:.55;transform:scale(.85)}50%{opacity:1;transform:scale(1.15)}}
  .brand h1{font-size:15px;font-weight:900;letter-spacing:.14em}.brand h1 span{color:var(--blue)}
  .brand small{display:block;font-size:9.5px;letter-spacing:.32em;color:var(--dim);font-weight:600;margin-top:1px}
  .status{display:flex;align-items:center;gap:14px;font-size:11px;color:var(--dim);font-weight:600}
  .status .grp{display:flex;align-items:center;gap:7px}
  .status .live{width:7px;height:7px;border-radius:50%;background:var(--bull);box-shadow:0 0 10px var(--bull);animation:beat 2s infinite}
  .status b{color:var(--text);font-variant-numeric:tabular-nums}

  .legend{position:fixed;left:22px;bottom:24px;z-index:9;display:flex;flex-direction:column;gap:7px;
    background:var(--glass);backdrop-filter:blur(20px);border:1px solid var(--line);border-radius:14px;padding:12px 14px}
  .legend .row{display:flex;align-items:center;gap:9px;font-size:11px;font-weight:600;color:var(--dim)}
  .legend .sw{width:9px;height:9px;border-radius:50%}
  .legend .arc-sw{width:18px;height:2px;border-radius:2px;background:linear-gradient(90deg,var(--blue),transparent)}

  /* ЛЕНТА СИГНАЛОВ */
  #feed{position:fixed;top:64px;right:0;bottom:0;width:340px;max-width:86vw;z-index:8;
    background:linear-gradient(270deg,rgba(3,5,11,.78),transparent);padding:14px 16px 24px;overflow-y:auto;
    transition:transform .4s cubic-bezier(.22,1,.36,1)}
  #feed.hidden{transform:translateX(102%)}
  #feed .ft{display:flex;align-items:center;justify-content:space-between;font-size:10px;letter-spacing:.22em;
    font-weight:800;color:var(--blue);margin-bottom:12px}
  #feed .ft .upd{color:var(--dim);letter-spacing:.04em;font-weight:600}
  .sigcard{background:var(--glass);backdrop-filter:blur(16px);border:1px solid var(--line);border-radius:14px;
    padding:11px 13px;margin-bottom:9px;cursor:pointer;transition:.2s;animation:slidein .5s ease}
  .sigcard:hover{border-color:rgba(10,132,255,.5);transform:translateX(-3px)}
  @keyframes slidein{from{opacity:0;transform:translateX(20px)}to{opacity:1;transform:translateX(0)}}
  .sigcard .top{display:flex;align-items:center;gap:8px;margin-bottom:5px}
  .sigcard .tk{font-family:var(--mono);font-weight:800;font-size:13px}
  .sigcard .dir{font-size:9px;font-weight:800;letter-spacing:.08em;padding:2px 6px;border-radius:6px;text-transform:uppercase}
  .sigcard .imp{margin-left:auto;font-family:var(--mono);font-size:11px;font-weight:700;color:var(--dim)}
  .sigcard .hl{font-size:12px;line-height:1.4;color:var(--text);opacity:.92}
  .sigcard .meta{font-size:10px;color:var(--dim);margin-top:5px;font-weight:500}
  .feed-empty{font-size:12px;color:var(--dim);text-align:center;padding:30px 10px;line-height:1.6}

  #feedToggle{position:fixed;top:64px;right:14px;z-index:11;background:var(--glass);backdrop-filter:blur(16px);
    border:1px solid var(--line);border-radius:10px;color:var(--text);font-size:11px;font-weight:700;
    padding:7px 11px;cursor:pointer;display:none}
  @media (max-width:760px){#feed{width:100%}#feedToggle{display:block}}

  .booting{position:fixed;inset:0;z-index:30;display:flex;align-items:center;justify-content:center;background:#03050b;
    font-size:12px;letter-spacing:.3em;color:var(--blue);font-weight:800;transition:opacity .6s}
  .booting.gone{opacity:0;pointer-events:none}
  @media (prefers-reduced-motion:reduce){*{animation:none!important;transition:none!important}}
</style>
</head>
<body>

<div class="booting" id="boot">ИНИЦИАЛИЗАЦИЯ ШАРА…</div>
<div id="globe"></div>
<div class="vignette"></div>

<header>
  <div class="brand">
    <div class="dot"></div>
    <div><h1><span>STARK</span> · ГЛОБУС</h1><small>I AM IRON MAN · GLOBAL SIGNAL TERMINAL</small></div>
  </div>
  <div class="status">
    <span class="grp"><span class="live"></span>LIVE</span>
    <span class="grp"><b id="sigCount">0</b> сигналов</span>
    <span class="grp">обновлено <b id="updTime">—</b></span>
  </div>
</header>

<button id="feedToggle" onclick="document.getElementById('feed').classList.toggle('hidden')">☰ Лента</button>

<div class="legend">
  <div class="row"><span class="sw" style="background:var(--bull)"></span>BULL</div>
  <div class="row"><span class="sw" style="background:var(--bear)"></span>BEAR</div>
  <div class="row"><span class="sw" style="background:var(--neutral)"></span>НЕЙТРАЛ</div>
  <div class="row"><span class="arc-sw"></span>цепочка / лид</div>
</div>

<div id="feed">
  <div class="ft"><span>ЛЕНТА СИГНАЛОВ</span><span class="upd" id="feedUpd"></span></div>
  <div id="feedList"><div class="feed-empty">Подключаюсь к потоку…</div></div>
</div>

<script>
/* ════════ КОНФИГ ════════ */
const SUPA_URL = 'https://wfoyypwscvcxriqbsnew.supabase.co';
const SUPA_KEY = 'sb_publishable_EwMdgEUXGLLlygEgzfNwYw_XcirqHgg';
const POLL_MS = 60000; // обновление каждые 60 сек

/* ════════ БАЗОВЫЙ ВОТЧЛИСТ (скелет, статичный) ════════ */
const NODES = [
  {t:'NVDA',name:'NVIDIA — Santa Clara, CA',lat:37.37,lng:-121.96,score:84,dir:'bull',sector:'Semis / AI'},
  {t:'TSM',name:'TSMC — Hsinchu, Taiwan',lat:24.78,lng:121.00,score:79,dir:'bull',sector:'Foundry'},
  {t:'AMD',name:'AMD — Santa Clara, CA',lat:37.36,lng:-121.97,score:72,dir:'bull',sector:'Semis / AI'},
  {t:'META',name:'Meta — Menlo Park, CA',lat:37.48,lng:-122.15,score:68,dir:'bull',sector:'Mega-cap'},
  {t:'AAPL',name:'Apple — Cupertino, CA',lat:37.33,lng:-122.03,score:61,dir:'neutral',sector:'Mega-cap'},
  {t:'NKE',name:'Nike — Beaverton, OR',lat:45.51,lng:-122.78,score:58,dir:'neutral',sector:'Consumer'},
  {t:'LMT',name:'Lockheed Martin — Bethesda, MD',lat:39.00,lng:-77.10,score:55,dir:'neutral',sector:'Defense'},
  {t:'TSLA',name:'Tesla — Austin, TX',lat:30.27,lng:-97.74,score:44,dir:'bear',sector:'Auto / EV'},
];
const ARCS = [
  {from:'NKE',to:[24.15,120.67],label:'Nike ← тайваньский OEM'},
  {from:'NVDA',to:[24.78,121.00],label:'NVDA ← TSMC'},
  {from:'AMD',to:[24.78,121.00],label:'AMD ← TSMC'},
  {from:'AAPL',to:[34.75,113.62],label:'Apple ← Foxconn'},
];
const COL={bull:'#30d158',bear:'#ff453a',neutral:'#8a9099',chain:'#0a84ff'};
const HOT=['United States of America','Taiwan','China'];
const byT=Object.fromEntries(NODES.map(n=>[n.t,n]));
const arcData=ARCS.map(a=>{const f=byT[a.from];return{startLat:f.lat,startLng:f.lng,endLat:a.to[0],endLng:a.to[1],label:a.label};});
function hexRgb(h){const n=parseInt(h.slice(1),16);return`${(n>>16)&255},${(n>>8)&255},${n&255}`;}

let world, liveSignals=[];

function init(){
  if(typeof Globe==='undefined'){fail('Не загрузился globe.gl. На Vercel загрузится.');return;}
  world=Globe()(document.getElementById('globe'))
    .backgroundColor('#03050b')
    .backgroundImageUrl('https://unpkg.com/three-globe/example/img/night-sky.png')
    .showAtmosphere(true).atmosphereColor('#0a84ff').atmosphereAltitude(0.22)
    .pointsData(NODES).pointLat('lat').pointLng('lng')
    .pointColor(d=>COL[d.dir]).pointAltitude(d=>0.04+d.score/260).pointRadius(0.32).pointResolution(18)
    .pointLabel(d=>`<div style="font-family:Inter;font-size:12px;color:#fff;background:rgba(8,12,20,.92);border:1px solid rgba(10,132,255,.4);border-radius:10px;padding:8px 11px"><b style="font-size:14px">${d.t}</b> · ${d.sector}</div>`)
    .arcsData(arcData).arcColor(()=>['rgba(10,132,255,.05)','rgba(10,132,255,1)'])
    .arcDashLength(0.5).arcDashGap(0.22).arcDashAnimateTime(2400).arcStroke(0.55).arcAltitude(0.28).arcLabel('label')
    .htmlElementsData(NODES.filter(n=>n.score>=72)).htmlLat('lat').htmlLng('lng').htmlAltitude(d=>0.05+d.score/240)
    .htmlElement(d=>{const el=document.createElement('div');el.className='floatlab';el.innerHTML=`<span style="color:${COL[d.dir]}">${d.t}</span><span class="s" style="color:#9aa3af">${d.score}</span>`;return el;});

  fetch('https://unpkg.com/world-atlas@2/countries-110m.json').then(r=>r.json()).then(topo=>{
    const feats=topojson.feature(topo,topo.objects.countries).features;
    world.hexPolygonsData(feats).hexPolygonResolution(3).hexPolygonMargin(0.32).hexPolygonUseDots(true)
      .hexPolygonColor(f=>HOT.includes(f.properties.name)?'rgba(10,132,255,.95)':'rgba(10,132,255,.32)')
      .hexPolygonAltitude(f=>HOT.includes(f.properties.name)?0.012:0.004);
  }).catch(()=>world.globeImageUrl('https://unpkg.com/three-globe/example/img/earth-night.jpg'));

  world.controls().autoRotate=true; world.controls().autoRotateSpeed=0.42; world.controls().enableZoom=true;
  world.pointOfView({lat:34,lng:-110,altitude:2.2},0);
  setTimeout(()=>world.pointOfView({lat:28,lng:-30,altitude:2.5},4500),700);
  window.addEventListener('resize',()=>world.width(innerWidth).height(innerHeight));
  setTimeout(()=>document.getElementById('boot').classList.add('gone'),900);

  pollSignals();
  setInterval(pollSignals, POLL_MS);
}
function fail(msg){const b=document.getElementById('boot');b.textContent=msg;b.style.letterSpacing='normal';b.style.fontWeight='500';b.style.color='#9aa3af';b.style.padding='30px';b.style.textAlign='center';}

/* ════════ LIVE: тянем сигналы из Supabase ════════ */
async function pollSignals(){
  try{
    const r = await fetch(`${SUPA_URL}/rest/v1/signals?select=*&order=created_at.desc&limit=80`,{
      headers:{ apikey:SUPA_KEY, Authorization:'Bearer '+SUPA_KEY }
    });
    if(!r.ok) throw new Error('HTTP '+r.status);
    const rows = await r.json();
    liveSignals = Array.isArray(rows)?rows:[];
    renderSignals();
  }catch(e){
    document.getElementById('feedList').innerHTML = `<div class="feed-empty">Поток недоступен.<br><span style="font-size:10px">${e.message}</span></div>`;
  }
}

function renderSignals(){
  // пульсы на шаре
  const rings = liveSignals.filter(s=>s.lat!=null&&s.lng!=null).map(s=>({
    lat:+s.lat, lng:+s.lng, col:COL[s.direction]||COL.neutral,
    speed: 1.2 + (s.impact||0)/60, max: 2.5 + (s.impact||0)/30
  }));
  world.ringsData(rings)
    .ringColor(d=>t=>`rgba(${hexRgb(d.col)},${1-t})`)
    .ringMaxRadius(d=>d.max).ringPropagationSpeed(d=>d.speed).ringRepeatPeriod(1500);

  // точки-события
  const ev = liveSignals.filter(s=>s.lat!=null&&s.lng!=null).map(s=>({
    lat:+s.lat,lng:+s.lng,direction:s.direction,ticker:s.ticker,headline:s.headline,impact:s.impact
  }));
  world.customLayerData(ev); // лёгкий слой не используем, пульсов достаточно

  // счётчики
  document.getElementById('sigCount').textContent = liveSignals.length;
  const now = new Date();
  const t = now.toLocaleTimeString('ru-RU',{hour:'2-digit',minute:'2-digit'});
  document.getElementById('updTime').textContent = t;
  document.getElementById('feedUpd').textContent = t;

  // лента
  const list = document.getElementById('feedList');
  if(!liveSignals.length){ list.innerHTML='<div class="feed-empty">Пока нет сигналов.<br>n8n дольёт при следующем прогоне.</div>'; return; }
  list.innerHTML = liveSignals.slice(0,40).map(s=>{
    const c = COL[s.direction]||COL.neutral;
    const dirTxt = {bull:'BULL',bear:'BEAR',neutral:'НЕЙТР'}[s.direction]||'—';
    const when = s.created_at ? new Date(s.created_at).toLocaleTimeString('ru-RU',{hour:'2-digit',minute:'2-digit'}) : '';
    return `<div class="sigcard" onclick="flyTo(${+s.lat},${+s.lng})">
      <div class="top"><span class="tk">${s.ticker||'—'}</span>
        <span class="dir" style="background:${c}22;color:${c}">${dirTxt}</span>
        <span class="imp">${s.impact??''}</span></div>
      <div class="hl">${escapeHtml(s.headline||s.company||'')}</div>
      <div class="meta">${escapeHtml(s.sector||'')}${when?' · '+when:''}</div>
    </div>`;
  }).join('');
}
function flyTo(lat,lng){ if(world){ world.controls().autoRotate=false; world.pointOfView({lat,lng,altitude:1.6},1000); } }
function escapeHtml(s){return String(s).replace(/[&<>"]/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;'}[c]));}

init();
</script>
</body>
</html>
