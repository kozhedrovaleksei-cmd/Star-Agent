<!DOCTYPE html>
<html lang="ru">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>STARK · ГЛОБУС</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700;800;900&display=swap" rel="stylesheet">
<script src="https://unpkg.com/globe.gl"></script>
<script src="https://unpkg.com/topojson-client@3"></script>
<style>
  :root{
    --bg:#03050b; --glass:rgba(14,18,28,.66); --line:rgba(255,255,255,.08);
    --blue:#0a84ff; --blue-soft:rgba(10,132,255,.16);
    --bull:#30d158; --bear:#ff453a; --neutral:#8a9099;
    --text:#f5f7fa; --dim:#9aa3af; --r:18px;
    --mono:'Inter',ui-monospace,'SF Mono',Menlo,monospace;
  }
  *{box-sizing:border-box;margin:0;padding:0}
  html,body{height:100%;background:#03050b;color:var(--text);font-family:'Inter',-apple-system,sans-serif;overflow:hidden}
  #globe{position:fixed;inset:0;z-index:1}#globe canvas{display:block}
  .vignette{position:fixed;inset:0;z-index:2;pointer-events:none;background:radial-gradient(120% 120% at 50% 45%,transparent 52%,rgba(3,5,11,.55) 82%,rgba(3,5,11,.92) 100%)}

  .floatlab{transform:translate(-50%,-50%);pointer-events:none;white-space:nowrap;display:flex;align-items:center;gap:6px;font-family:var(--mono);font-size:11px;font-weight:800;background:rgba(8,12,20,.72);border:1px solid rgba(10,132,255,.45);border-radius:9px;padding:4px 8px;box-shadow:0 0 16px rgba(10,132,255,.35);backdrop-filter:blur(4px)}
  .floatlab .s{font-size:10px;font-weight:700}

  header{position:fixed;top:0;left:0;right:0;z-index:10;display:flex;align-items:center;justify-content:space-between;padding:14px 22px;background:linear-gradient(180deg,rgba(3,5,11,.9),transparent);backdrop-filter:blur(14px)}
  .brand{display:flex;align-items:center;gap:12px}
  .brand .dot{width:9px;height:9px;border-radius:50%;background:var(--blue);box-shadow:0 0 16px var(--blue);animation:beat 2.4s ease-in-out infinite}
  @keyframes beat{0%,100%{opacity:.55;transform:scale(.85)}50%{opacity:1;transform:scale(1.15)}}
  .brand h1{font-size:15px;font-weight:900;letter-spacing:.14em}.brand h1 span{color:var(--blue)}
  .brand small{display:block;font-size:9.5px;letter-spacing:.32em;color:var(--dim);font-weight:600;margin-top:1px}
  .status{display:flex;align-items:center;gap:14px;font-size:11px;color:var(--dim);font-weight:600}
  .status .grp{display:flex;align-items:center;gap:7px}
  .status .live{width:7px;height:7px;border-radius:50%;background:var(--bull);box-shadow:0 0 10px var(--bull);animation:beat 2s infinite}
  .status b{color:var(--text);font-variant-numeric:tabular-nums}

  /* ПАНЕЛЬ КЛАСТЕРОВ */
  #clusterbar{position:fixed;top:60px;left:0;right:0;z-index:9;display:flex;align-items:center;gap:10px;padding:8px 18px;
    background:linear-gradient(180deg,rgba(3,5,11,.7),transparent);backdrop-filter:blur(8px)}
  .toggle{display:flex;background:rgba(255,255,255,.06);border:1px solid var(--line);border-radius:11px;padding:3px;flex:0 0 auto}
  .toggle button{border:none;background:none;color:var(--dim);font-family:Inter;font-size:11px;font-weight:700;padding:5px 12px;border-radius:8px;cursor:pointer;transition:.2s}
  .toggle button.on{background:var(--blue);color:#fff}
  .chips{display:flex;gap:7px;overflow-x:auto;flex:1;padding-bottom:2px;scrollbar-width:none}
  .chips::-webkit-scrollbar{display:none}
  .chip{flex:0 0 auto;display:flex;align-items:center;gap:6px;background:var(--glass);backdrop-filter:blur(12px);border:1px solid var(--line);border-radius:10px;padding:6px 11px;font-size:11px;font-weight:700;color:var(--text);cursor:pointer;white-space:nowrap;transition:.2s}
  .chip:hover{border-color:rgba(10,132,255,.5)}
  .chip.on{background:var(--blue);border-color:var(--blue);color:#fff}
  .chip .cnt{font-family:var(--mono);font-size:10px;font-weight:800;opacity:.7}
  .chip.on .cnt{opacity:.9}

  .legend{position:fixed;left:22px;bottom:24px;z-index:9;display:flex;flex-direction:column;gap:7px;background:var(--glass);backdrop-filter:blur(20px);border:1px solid var(--line);border-radius:14px;padding:12px 14px}
  .legend .row{display:flex;align-items:center;gap:9px;font-size:11px;font-weight:600;color:var(--dim)}
  .legend .sw{width:9px;height:9px;border-radius:50%}

  #feed{position:fixed;top:106px;right:0;bottom:0;width:340px;max-width:86vw;z-index:8;background:linear-gradient(270deg,rgba(3,5,11,.78),transparent);padding:14px 16px 24px;overflow-y:auto;transition:transform .4s cubic-bezier(.22,1,.36,1)}
  #feed.hidden{transform:translateX(102%)}
  #feed .ft{display:flex;align-items:center;justify-content:space-between;font-size:10px;letter-spacing:.18em;font-weight:800;color:var(--blue);margin-bottom:12px}
  #feed .ft .upd{color:var(--dim);letter-spacing:.04em;font-weight:600}
  .sigcard{background:var(--glass);backdrop-filter:blur(16px);border:1px solid var(--line);border-radius:14px;padding:11px 13px;margin-bottom:9px;cursor:pointer;transition:.2s;animation:slidein .5s ease}
  .sigcard:hover{border-color:rgba(10,132,255,.5);transform:translateX(-3px)}
  @keyframes slidein{from{opacity:0;transform:translateX(20px)}to{opacity:1;transform:translateX(0)}}
  .sigcard .top{display:flex;align-items:center;gap:8px;margin-bottom:5px}
  .sigcard .tk{font-family:var(--mono);font-weight:800;font-size:13px}
  .sigcard .dir{font-size:9px;font-weight:800;letter-spacing:.08em;padding:2px 6px;border-radius:6px;text-transform:uppercase}
  .sigcard .imp{margin-left:auto;font-family:var(--mono);font-size:11px;font-weight:700;color:var(--dim)}
  .sigcard .hl{font-size:12px;line-height:1.4;color:var(--text);opacity:.92}
  .sigcard .meta{font-size:10px;color:var(--dim);margin-top:5px;font-weight:500}
  .feed-empty{font-size:12px;color:var(--dim);text-align:center;padding:30px 10px;line-height:1.6}

  #feedToggle{position:fixed;top:106px;right:14px;z-index:11;background:var(--glass);backdrop-filter:blur(16px);border:1px solid var(--line);border-radius:10px;color:var(--text);font-size:11px;font-weight:700;padding:7px 11px;cursor:pointer;display:none}
  @media (max-width:760px){#feed{width:100%}#feedToggle{display:block}.brand small{display:none}}

  .booting{position:fixed;inset:0;z-index:30;display:flex;align-items:center;justify-content:center;background:#03050b;font-size:12px;letter-spacing:.3em;color:var(--blue);font-weight:800;transition:opacity .6s}
  .booting.gone{opacity:0;pointer-events:none}
  @media (prefers-reduced-motion:reduce){*{animation:none!important;transition:none!important}}
</style>
</head>
<body>

<div class="booting" id="boot">ИНИЦИАЛИЗАЦИЯ ШАРА…</div>
<div id="globe"></div>
<div class="vignette"></div>

<header>
  <div class="brand"><div class="dot"></div><div><h1><span>STARK</span> · ГЛОБУС</h1><small>I AM IRON MAN · GLOBAL SIGNAL TERMINAL</small></div></div>
  <div class="status"><span class="grp"><span class="live"></span>LIVE</span><span class="grp"><b id="sigCount">0</b> сигналов</span><span class="grp">обновлено <b id="updTime">—</b></span></div>
</header>

<div id="clusterbar">
  <div class="toggle">
    <button id="modeSector" class="on" onclick="setMode('sector')">Секторы</button>
    <button id="modeRegion" onclick="setMode('region')">Регионы</button>
  </div>
  <div class="chips" id="chips"></div>
</div>

<button id="feedToggle" onclick="document.getElementById('feed').classList.toggle('hidden')">☰ Лента</button>

<div class="legend">
  <div class="row"><span class="sw" style="background:var(--bull)"></span>BULL</div>
  <div class="row"><span class="sw" style="background:var(--bear)"></span>BEAR</div>
  <div class="row"><span class="sw" style="background:var(--neutral)"></span>НЕЙТРАЛ</div>
</div>

<div id="feed">
  <div class="ft"><span id="feedTitle">ВЕСЬ РЫНОК</span><span class="upd" id="feedUpd"></span></div>
  <div id="feedList"><div class="feed-empty">Подключаюсь к потоку…</div></div>
</div>

<script>
/* ════════ КОНФИГ ════════ */
const SUPA_URL = 'https://wfoyypwscvcxriqbsnew.supabase.co';
const SUPA_KEY = 'sb_publishable_EwMdgEUXGLLlygEgzfNwYw_XcirqHgg';
const POLL_MS = 60000;

/* ════════ БАЗОВЫЙ ВОТЧЛИСТ (скелет) ════════ */
const NODES = [
  {t:'NVDA',name:'NVIDIA',lat:37.37,lng:-121.96,score:84,dir:'bull'},
  {t:'TSM',name:'TSMC',lat:24.78,lng:121.00,score:79,dir:'bull'},
  {t:'AMD',name:'AMD',lat:37.36,lng:-121.97,score:72,dir:'bull'},
  {t:'META',name:'Meta',lat:37.48,lng:-122.15,score:68,dir:'bull'},
  {t:'AAPL',name:'Apple',lat:37.33,lng:-122.03,score:61,dir:'neutral'},
  {t:'NKE',name:'Nike',lat:45.51,lng:-122.78,score:58,dir:'neutral'},
  {t:'LMT',name:'Lockheed',lat:39.00,lng:-77.10,score:55,dir:'neutral'},
  {t:'TSLA',name:'Tesla',lat:30.27,lng:-97.74,score:44,dir:'bear'},
];
const COL={bull:'#30d158',bear:'#ff453a',neutral:'#8a9099'};
const HOT=['United States of America','Taiwan','China'];
function hexRgb(h){const n=parseInt(h.slice(1),16);return`${(n>>16)&255},${(n>>8)&255},${n&255}`;}

/* ════════ ТАКСОНОМИЯ КЛАСТЕРОВ ════════ */
const SECTOR_BY_TICKER = {
  NVDA:'Полупроводники / AI',TSM:'Полупроводники / AI',AMD:'Полупроводники / AI',AVGO:'Полупроводники / AI',MU:'Полупроводники / AI',ASML:'Полупроводники / AI',INTC:'Полупроводники / AI',ARM:'Полупроводники / AI',MRVL:'Полупроводники / AI',SMCI:'Полупроводники / AI',QCOM:'Полупроводники / AI',
  AAPL:'Мега-тех',MSFT:'Мега-тех',GOOGL:'Мега-тех',GOOG:'Мега-тех',AMZN:'Мега-тех',ORCL:'Мега-тех',
  META:'Медиа / Комм',NFLX:'Медиа / Комм',DIS:'Медиа / Комм',
  NKE:'Потребительский',TSLA:'Потребительский',MCD:'Потребительский',SBUX:'Потребительский',LULU:'Потребительский',
  LMT:'Оборона / Аэрокосмос',RTX:'Оборона / Аэрокосмос',NOC:'Оборона / Аэрокосмос',BA:'Оборона / Аэрокосмос',GD:'Оборона / Аэрокосмос',
  XOM:'Энергетика',CVX:'Энергетика',COP:'Энергетика',
  JPM:'Финансы',GS:'Финансы',BAC:'Финансы',V:'Финансы',MA:'Финансы',
  LLY:'Здравоохранение',UNH:'Здравоохранение',PFE:'Здравоохранение',JNJ:'Здравоохранение',
  TAO:'Крипто',RNDR:'Крипто',FET:'Крипто',SUI:'Крипто',LINK:'Крипто',BTC:'Крипто',ETH:'Крипто'
};
function sectorOf(s){
  if(SECTOR_BY_TICKER[s.ticker]) return SECTOR_BY_TICKER[s.ticker];
  if(s.source==='crypto'||s.source==='kucoin') return 'Крипто';
  const txt=((s.sector||'')+' '+(s.company||'')).toLowerCase();
  if(/semicond|foundry|chip|gpu|\bai\b| artificial/.test(txt)) return 'Полупроводники / AI';
  if(/defense|aerospace|military|defence/.test(txt)) return 'Оборона / Аэрокосмос';
  if(/energy|\boil\b|\bgas\b|petro/.test(txt)) return 'Энергетика';
  if(/financ|bank|payment|insur/.test(txt)) return 'Финансы';
  if(/health|pharma|biotech|medical/.test(txt)) return 'Здравоохранение';
  if(/media|communicat|social|stream/.test(txt)) return 'Медиа / Комм';
  if(/consumer|retail|auto|apparel|electronics|mega/.test(txt)) return 'Потребительский';
  if(/industrial|manufactur|machin/.test(txt)) return 'Промышленность';
  return 'Прочее';
}
function regionOf(s){
  const la=+s.lat, ln=+s.lng;
  if(la>=15&&la<=72&&ln>=-170&&ln<=-50) return 'Северная Америка';
  if(la>=-40&&la<=15&&ln>=-85&&ln<=-30) return 'Южная Америка';
  if(la>=35&&la<=72&&ln>=-25&&ln<=45) return 'Европа';
  if(la>=12&&la<=42&&ln>=34&&ln<=63) return 'Ближний Восток';
  if(la>=-12&&la<=72&&ln>=60&&ln<=155) return 'Азия';
  return 'Прочий мир';
}
const REGION_CENTER={'Северная Америка':[39,-98],'Южная Америка':[-14,-55],'Европа':[52,13],'Ближний Восток':[27,45],'Азия':[30,110],'Прочий мир':[0,20]};

/* ════════ СОСТОЯНИЕ ════════ */
let world, liveSignals=[], mode='sector', active=null, countryLabels=[], labelsShown=false;

function init(){
  if(typeof Globe==='undefined'){fail('Не загрузился globe.gl. На Vercel загрузится.');return;}
  world=Globe()(document.getElementById('globe'))
    .backgroundColor('#03050b')
    .backgroundImageUrl('https://unpkg.com/three-globe/example/img/night-sky.png')
    .showAtmosphere(true).atmosphereColor('#0a84ff').atmosphereAltitude(0.22)
    .pointsData(NODES).pointLat('lat').pointLng('lng')
    .pointColor(d=>COL[d.dir]).pointAltitude(d=>0.04+d.score/260).pointRadius(0.32).pointResolution(18)
    .pointLabel(d=>`<div style="font-family:Inter;font-size:12px;color:#fff;background:rgba(8,12,20,.92);border:1px solid rgba(10,132,255,.4);border-radius:10px;padding:8px 11px"><b style="font-size:14px">${d.t}</b></div>`)
    .htmlElementsData(NODES.filter(n=>n.score>=72)).htmlLat('lat').htmlLng('lng').htmlAltitude(d=>0.05+d.score/240)
    .htmlElement(d=>{const el=document.createElement('div');el.className='floatlab';el.innerHTML=`<span style="color:${COL[d.dir]}">${d.t}</span><span class="s" style="color:#9aa3af">${d.score}</span>`;return el;})
    .labelsData([]).labelLat('lat').labelLng('lng').labelText('name')
    .labelSize(1.1).labelDotRadius(0).labelColor(()=>'rgba(230,240,255,.85)').labelResolution(1).labelAltitude(0.008);

  fetch('https://unpkg.com/world-atlas@2/countries-110m.json').then(r=>r.json()).then(topo=>{
    const feats=topojson.feature(topo,topo.objects.countries).features;
    world.hexPolygonsData(feats).hexPolygonResolution(3).hexPolygonMargin(0.32).hexPolygonUseDots(true)
      .hexPolygonColor(f=>HOT.includes(f.properties.name)?'rgba(10,132,255,.95)':'rgba(10,132,255,.32)')
      .hexPolygonAltitude(f=>HOT.includes(f.properties.name)?0.012:0.004);
    // центроиды для подписей стран
    countryLabels = feats.filter(f=>f.properties&&f.properties.name).map(f=>{
      const c=centroid(f.geometry); return {name:f.properties.name,lat:c[1],lng:c[0]};
    });
  }).catch(()=>world.globeImageUrl('https://unpkg.com/three-globe/example/img/earth-night.jpg'));

  world.controls().autoRotate=true; world.controls().autoRotateSpeed=0.42; world.controls().enableZoom=true;
  world.pointOfView({lat:34,lng:-110,altitude:2.2},0);
  setTimeout(()=>world.pointOfView({lat:28,lng:-30,altitude:2.5},4500),700);

  // ПОДПИСИ СТРАН ПРИ ПРИБЛИЖЕНИИ
  world.onZoom(pov=>{
    const show = pov.altitude < 1.7;
    if(show!==labelsShown){ labelsShown=show; world.labelsData(show?countryLabels:[]); }
    if(show) world.controls().autoRotate=false;
  });

  window.addEventListener('resize',()=>world.width(innerWidth).height(innerHeight));
  setTimeout(()=>document.getElementById('boot').classList.add('gone'),900);
  pollSignals(); setInterval(pollSignals, POLL_MS);
}
function fail(msg){const b=document.getElementById('boot');b.textContent=msg;b.style.letterSpacing='normal';b.style.fontWeight='500';b.style.color='#9aa3af';b.style.padding='30px';b.style.textAlign='center';}
function centroid(geom){let x=0,y=0,n=0;const walk=c=>{if(typeof c[0]==='number'){x+=c[0];y+=c[1];n++;}else c.forEach(walk);};walk(geom.coordinates);return[x/n,y/n];}

/* ════════ LIVE ════════ */
async function pollSignals(){
  try{
    const r=await fetch(`${SUPA_URL}/rest/v1/signals?select=*&order=created_at.desc&limit=120`,{headers:{apikey:SUPA_KEY,Authorization:'Bearer '+SUPA_KEY}});
    if(!r.ok) throw new Error('HTTP '+r.status);
    const rows=await r.json(); liveSignals=Array.isArray(rows)?rows:[];
    const now=new Date().toLocaleTimeString('ru-RU',{hour:'2-digit',minute:'2-digit'});
    document.getElementById('updTime').textContent=now; document.getElementById('feedUpd').textContent=now;
    document.getElementById('sigCount').textContent=liveSignals.length;
    renderChips(); render();
  }catch(e){ document.getElementById('feedList').innerHTML=`<div class="feed-empty">Поток недоступен.<br><span style="font-size:10px">${e.message}</span></div>`; }
}

function clusterOf(s){ return mode==='sector'?sectorOf(s):regionOf(s); }

function renderChips(){
  const counts={};
  liveSignals.forEach(s=>{const c=clusterOf(s);counts[c]=(counts[c]||0)+1;});
  const order=Object.keys(counts).sort((a,b)=>counts[b]-counts[a]);
  const chips=document.getElementById('chips');
  let html=`<div class="chip ${active===null?'on':''}" onclick="pick(null)">Все <span class="cnt">${liveSignals.length}</span></div>`;
  html+=order.map(c=>`<div class="chip ${active===c?'on':''}" onclick="pick('${c.replace(/'/g,"\\'")}')">${c} <span class="cnt">${counts[c]}</span></div>`).join('');
  chips.innerHTML=html;
}
function pick(c){
  active=c; renderChips(); render();
  if(c){
    const subset=liveSignals.filter(s=>clusterOf(s)===c).filter(s=>s.lat!=null);
    let center;
    if(mode==='region'&&REGION_CENTER[c]) center=REGION_CENTER[c];
    else if(subset.length){ const la=subset.reduce((a,s)=>a+ +s.lat,0)/subset.length, ln=subset.reduce((a,s)=>a+ +s.lng,0)/subset.length; center=[la,ln]; }
    if(center){ world.controls().autoRotate=false; world.pointOfView({lat:center[0],lng:center[1],altitude:1.8},1000); }
  }
}
function setMode(m){
  mode=m; active=null;
  document.getElementById('modeSector').classList.toggle('on',m==='sector');
  document.getElementById('modeRegion').classList.toggle('on',m==='region');
  renderChips(); render();
}

function render(){
  const data = active===null?liveSignals:liveSignals.filter(s=>clusterOf(s)===active);
  // пульсы
  const rings=data.filter(s=>s.lat!=null&&s.lng!=null).map(s=>({lat:+s.lat,lng:+s.lng,col:COL[s.direction]||COL.neutral,speed:1.2+(s.impact||0)/60,max:2.5+(s.impact||0)/30}));
  world.ringsData(rings).ringColor(d=>t=>`rgba(${hexRgb(d.col)},${1-t})`).ringMaxRadius(d=>d.max).ringPropagationSpeed(d=>d.speed).ringRepeatPeriod(1500);
  // заголовок ленты
  document.getElementById('feedTitle').textContent = active===null?'ВЕСЬ РЫНОК':active.toUpperCase();
  // лента
  const list=document.getElementById('feedList');
  if(!data.length){ list.innerHTML='<div class="feed-empty">Нет сигналов в этом кластере.</div>'; return; }
  list.innerHTML=data.slice(0,50).map(s=>{
    const c=COL[s.direction]||COL.neutral, dir={bull:'BULL',bear:'BEAR',neutral:'НЕЙТР'}[s.direction]||'—';
    const when=s.created_at?new Date(s.created_at).toLocaleTimeString('ru-RU',{hour:'2-digit',minute:'2-digit'}):'';
    return `<div class="sigcard" onclick="flyTo(${+s.lat},${+s.lng})"><div class="top"><span class="tk">${s.ticker||'—'}</span><span class="dir" style="background:${c}22;color:${c}">${dir}</span><span class="imp">${s.impact??''}</span></div><div class="hl">${esc(s.headline||s.company||'')}</div><div class="meta">${esc(clusterOf(s))}${when?' · '+when:''}</div></div>`;
  }).join('');
}
function flyTo(lat,lng){if(world&&lat!=null){world.controls().autoRotate=false;world.pointOfView({lat,lng,altitude:1.5},1000);}}
function esc(s){return String(s).replace(/[&<>"]/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;'}[c]));}

init();
</script>
</body>
</html>
