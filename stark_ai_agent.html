<!DOCTYPE html>
<html lang="ru">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>⚡️ STARK UNIVERSAL AGGREGATOR v2.0</title>
  <style>
    body { font-family: 'Segoe UI', sans-serif; background: #0a0a0a; color: #00ff9d; margin: 0; padding: 20px; }
    .container { max-width: 1200px; margin: 0 auto; }
    header { text-align: center; margin-bottom: 30px; }
    h1 { color: #00ff9d; }
    .controls { display: flex; gap: 12px; margin-bottom: 20px; flex-wrap: wrap; }
    input { flex: 1; padding: 16px; font-size: 18px; background: #1a1a1a; border: 2px solid #00ff9d; color: white; border-radius: 10px; }
    button { padding: 16px 40px; background: #00ff9d; color: #000; font-weight: bold; border: none; border-radius: 10px; cursor: pointer; }
    .quick-buttons { display: flex; flex-wrap: wrap; gap: 8px; margin: 15px 0; }
    .quick-btn { padding: 8px 18px; background: #1f1f1f; border: 1px solid #00ff9d; color: #00ff9d; border-radius: 8px; cursor: pointer; }
    .result { background: #111; padding: 30px; border-radius: 12px; border: 1px solid #00ff9d; white-space: pre-wrap; display: none; overflow-y: auto; max-height: 70vh; }
    .error { color: #ff6666; background: #330000; padding: 15px; border-radius: 8px; }
  </style>
</head>
<body>
  <div class="container">
    <header>
      <h1>⚡️ STARK UNIVERSAL AGGREGATOR v2.0</h1>
      <p>Скрытые корреляции • Полный анализ любого актива</p>
    </header>

    <div class="quick-buttons">
      <span class="quick-btn" onclick="quickAnalyze('NKE')">NKE</span>
      <span class="quick-btn" onclick="quickAnalyze('CCJ')">CCJ</span>
      <span class="quick-btn" onclick="quickAnalyze('JD')">JD</span>
      <span class="quick-btn" onclick="quickAnalyze('VST')">VST</span>
      <span class="quick-btn" onclick="quickAnalyze('BTC')">BTC</span>
      <span class="quick-btn" onclick="quickAnalyze('SBER')">SBER</span>
    </div>

    <div class="controls">
      <input type="text" id="tickerInput" placeholder="Введи тикер или название компании..." />
      <button onclick="startAnalysis()">⚡ АНАЛИЗИРОВАТЬ</button>
    </div>

    <div id="result" class="result"></div>
  </div>

  <script>
    async function startAnalysis() {
      let ticker = document.getElementById('tickerInput').value.trim();
      if (!ticker) return alert('Введите тикер!');
      analyze(ticker);
    }

    function quickAnalyze(ticker) {
      document.getElementById('tickerInput').value = ticker;
      analyze(ticker);
    }

    async function analyze(ticker) {
      const resultDiv = document.getElementById('result');
      resultDiv.style.display = 'block';
      resultDiv.innerHTML = `<p style="color:#ffd700">⚡️ STARK анализирует ${ticker}... Ищем скрытые корреляции</p>`;

      try {
        const priceRes = await fetch('/api/analyze', {
          method: 'POST',
          headers: {'Content-Type': 'application/json'},
          body: JSON.stringify({ action: 'price', ticker: ticker.toUpperCase() })
        });
        const priceData = await priceRes.json();

        const analyzeRes = await fetch('/api/analyze', {
          method: 'POST',
          headers: {'Content-Type': 'application/json'},
          body: JSON.stringify({ 
            action: 'analyze', 
            ticker: ticker.toUpperCase(),
            priceData 
          })
        });

        const data = await analyzeRes.json();
        resultDiv.innerHTML = data.text || data.error || 'Ошибка обработки';
      } catch (e) {
        resultDiv.innerHTML = `<div class="error">Ошибка: ${e.message}</div>`;
      }
    }
  </script>
</body>
</html>
